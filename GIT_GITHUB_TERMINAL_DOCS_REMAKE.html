<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando documentação...</title>
    <meta http-equiv="refresh" content="0; url=./index.html" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1722;
            --surface: #172131;
            --line-soft: rgba(148, 163, 184, 0.14);
            --text-strong: #f3f7ff;
            --text-main: #d7e0ea;
            --text-soft: #94a3b8;
            --blue: #60a5fa;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text-main);
            padding: 16px;
        }

        .redirect-box {
            width: min(100%, 560px);
            border: 1px solid var(--line-soft);
            background: var(--surface);
            border-radius: 10px;
            padding: 18px;
        }

        h1 {
            margin: 0;
            color: var(--text-strong);
            font-size: 1.2rem;
            line-height: 1.2;
        }

        p {
            margin: 10px 0 0;
            color: var(--text-soft);
            font-size: 0.94rem;
            line-height: 1.45;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="redirect-box">
        <h1>Documentação movida para a central</h1>
        <p>Este atalho antigo agora abre a nova estrutura de documentações. O redirecionamento é automático.</p>
        <div class="links">
            <a href="./index.html">Abrir central</a>
            <a href="./docs/git-github-terminal.html">Abrir documentação Git</a>
        </div>
    </main>

    <script>
        window.location.replace("./index.html");
    </script>
</body>

</html>
