<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Documentações</title>
    <link rel="stylesheet" href="./assets/css/docs-hub.css" />
</head>

<body>
    <main class="hub-shell">
        <header class="hub-header">
            <h1 id="hubTitle">Central de Documentações</h1>
            <p id="hubSubtitle">Escolha uma documentação e abra direto no navegador local, sem servidor.</p>
        </header>

        <section class="hub-list" aria-label="Lista de documentações disponíveis" id="hubList"></section>

        <p class="hub-footer" id="hubFooter">Dica: salve este arquivo nos favoritos e use como ponto de entrada único.
        </p>
    </main>

    <script defer src="./data/docs-manifest.data.js"></script>
    <script defer src="./assets/js/docs-hub.js"></script>
</body>

</html>
