id: php-sessoes-cookies-tokens
title: "PHP: Sessões, Cookies e Tokens"
subtitle: Guia prático para autenticação com sessão, cookies seguros, CSRF e geração de tokens em PHP.
searchPlaceholder: Buscar sessão, PHPSESSID, cookie, HttpOnly, token ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: php
defaultSectionLayout: single
quickStart:
  title: Como testar os exemplos desta documentação
  kicker: Requisitos e execução em ambiente local
  description: Como sessão e cookie dependem de HTTP, prefira testar com servidor local em vez de rodar só no CLI.
  steps:
    - Verifique o PHP com `php --version`.
    - Crie os arquivos de teste em uma pasta local.
    - Suba o servidor com `php -S localhost:8000`.
    - Abra `http://localhost:8000/login.php` no navegador.
  codeLanguage: shell
  code: |-
    php --version
    php -S localhost:8000
  callout:
    type: hint
    label: "Documentação relacionada:"
    text: "`PHP: Superglobais` resume `$_SESSION`, `$_COOKIE` e `$_SERVER` na requisição; este guia aprofunda fluxo de login, flags de cookie, tokens e CSRF."
sections:
  - id: o-que-sao-sessoes
    name: O que são sessões em PHP
    layout: single
    entries:
      - title: Sessão guarda estado no servidor entre requisições
        kicker: Dados da sessão ficam no servidor, não no navegador
        description: "Em HTTP puro, cada requisição é independente. Sessão resolve isso guardando dados no servidor para cada usuário. O navegador mantém apenas o identificador dessa sessão. O array `$_SESSION` (superglobal) só fica disponível após `session_start()`; para o mapa de todas as superglobais na mesma requisição, veja `PHP: Superglobais` no hub."
        code: |-
          <?php
          session_start(); // sempre inicie a sessao antes de acessar $_SESSION

          $_SESSION["carrinho_itens"] = 3; // valor salvo no servidor para este usuario
          $_SESSION["ultimo_acesso"] = date("c"); // estado da sessao persiste entre requisicoes

          echo "Sessão ativa no servidor. ID: " . session_id() . PHP_EOL;
        tags:
          - php
          - sessao
          - session
          - superglobais
          - estado
          - servidor
          - autenticacao
          - base
  - id: como-funciona-phpsessid
    name: Como funciona o PHPSESSID
    layout: single
    entries:
      - title: PHPSESSID conecta navegador com dados salvos no servidor
        kicker: O cookie carrega o identificador, não o conteúdo da sessão
        description: "`PHPSESSID` é o cookie padrão do PHP para identificar qual sessão no servidor pertence ao navegador atual. O valor da sessão continua no lado do servidor."
        code: |-
          <?php
          session_start(); // sem isso o PHP nao consegue ligar o navegador a sessao correta

          $cookieSessao = $_COOKIE["PHPSESSID"] ?? "(cookie ainda não recebido)";

          echo "Cookie PHPSESSID: {$cookieSessao}" . PHP_EOL;
          echo "session_id() atual: " . session_id() . PHP_EOL; // este ID referencia os dados guardados no servidor
        tags:
          - php
          - phpsessid
          - cookie
          - session-id
          - sessao
          - identificador
        callout:
          type: warn
          label: "Atenção:"
          text: se alguém roubar o identificador da sessão, pode tentar sequestrar a sessão. Por isso hardening de cookie e regeneração de ID são essenciais.
  - id: session-start
    name: session_start()
    layout: single
    entries:
      - title: session_start() inicia ou retoma a sessão atual
        kicker: Primeira chamada antes de usar `$_SESSION`
        description: Sem `session_start()`, o PHP não abre o contexto da sessão atual. Faça a chamada no começo do script, antes de enviar saída, headers ou HTML.
        code: |-
          <?php
          // login.php
          session_start(); // deve rodar antes de qualquer output/header

          $_SESSION["flash"] = "Você entrou no sistema."; // dado transitório para próxima requisição

          header("Location: /dashboard.php");
          exit;
        tags:
          - php
          - session_start
          - headers
          - inicio
          - sessao
          - autenticacao
        callout:
          type: danger
          label: "Perigo:"
          text: echo, espaço ou HTML antes de `session_start()` pode quebrar o envio de header e cookie de sessão.
  - id: session-array
    name: $_SESSION
    layout: single
    entries:
      - title: "`$_SESSION` é um array associativo por usuário"
        kicker: Guarde contexto de login e dados de fluxo curto
        description: "`$_SESSION` funciona como armazenamento por usuário para dados transitórios de aplicação, como identidade autenticada, preferências leves e tokens temporários."
        code: |-
          <?php
          session_start(); // abre a sessao do usuario atual

          $_SESSION["auth"] = [
              "id" => 42,
              "nome" => "Ana",
              "perfil" => "admin",
          ]; // dados minimos para identificar o usuario autenticado

          $_SESSION["preferencias"] = [
              "tema" => "dark",
              "idioma" => "pt-BR",
          ]; // estado leve que pode ser lido nas proximas paginas
        tags:
          - php
          - _session
          - array
          - auth
          - estado
          - dados
  - id: salvar-dados-sessao
    name: Como salvar dados na sessão
    layout: single
    entries:
      - title: Salvar usuário logado na sessão após autenticação
        kicker: Modelo prático de login com sessão
        description: Depois de validar credenciais, salve apenas os dados mínimos para identificar a pessoa autenticada e o contexto necessário para autorização.
        code: |-
          <?php
          session_start(); // inicia o contexto de sessao antes de gravar login

          $usuario = [
              "id" => 15,
              "nome" => "Bruno",
              "email" => "bruno@empresa.com",
              "perfil" => "editor",
          ];

          $_SESSION["auth"] = [
              "id" => $usuario["id"],
              "nome" => $usuario["nome"],
              "perfil" => $usuario["perfil"],
          ]; // grave apenas o essencial para autenticacao

          session_regenerate_id(true); // troca o ID para reduzir risco de session fixation

          echo "Login concluído para " . $_SESSION["auth"]["nome"] . PHP_EOL;
        tags:
          - php
          - sessao
          - login
          - auth
          - session_regenerate_id
          - salvar
  - id: ler-dados-sessao
    name: Como ler dados da sessão
    layout: single
    entries:
      - title: Verificar autenticação antes de abrir página protegida
        kicker: Leitura segura de sessão para controle de acesso
        description: Página protegida deve checar sessão ativa antes de renderizar conteúdo sensível. Se não houver autenticação, redirecione para login.
        code: |-
          <?php
          session_start(); // retoma a sessao para validar autenticacao

          if (!isset($_SESSION["auth"]["id"])) { // sem este dado, usuario nao esta logado
              header("Location: /login.php");
              exit;
          }

          echo "Usuário autenticado: " . $_SESSION["auth"]["nome"] . PHP_EOL;
          echo "Perfil: " . $_SESSION["auth"]["perfil"] . PHP_EOL;
        tags:
          - php
          - sessao
          - autenticacao
          - rota-protegida
          - auth
          - leitura
  - id: remover-dados-sessao
    name: Como remover dados da sessão
    layout: single
    entries:
      - title: Use unset() para remover chaves específicas
        kicker: Limpeza pontual sem destruir a sessão inteira
        description: Quando você quer limpar só parte do contexto, use `unset()` nas chaves necessárias. Isso evita perder outros dados úteis da sessão.
        code: |-
          <?php
          session_start(); // abre a sessao antes de remover chaves

          unset($_SESSION["flash"]); // remove apenas este item, sem destruir toda a sessao
          unset($_SESSION["csrf_token"]);

          // Remove várias chaves de uma vez
          unset($_SESSION["carrinho"], $_SESSION["checkout_temp"]);
        tags:
          - php
          - unset
          - sessao
          - limpeza
          - csrf
          - flash
  - id: destruir-sessao
    name: Como destruir uma sessão
    layout: single
    entries:
      - title: Logout completo com session_destroy()
        kicker: Finaliza sessão no servidor e invalida cookie no cliente
        description: Logout correto limpa dados em memória, destrói a sessão no servidor e expira o cookie da sessão no navegador.
        code: |-
          <?php
          session_start(); // precisa iniciar para conseguir encerrar corretamente

          $_SESSION = []; // limpa os dados em memoria da sessao atual

          if (ini_get("session.use_cookies")) {
              $params = session_get_cookie_params();
              setcookie(
                  session_name(),
                  "",
                  time() - 42000,
                  $params["path"],
                  $params["domain"],
                  $params["secure"],
                  $params["httponly"]
              ); // invalida o cookie de sessao no navegador
          }

          session_destroy(); // remove a sessao no servidor

          header("Location: /login.php");
          exit;
        tags:
          - php
          - logout
          - session_destroy
          - cookie
          - sessao
          - encerrar
      - title: Regenerar ID após login reduz risco de session fixation
        kicker: Trocar identificador antigo por um novo após autenticar
        description: Em session fixation, atacante força um ID conhecido antes do login. `session_regenerate_id(true)` troca o ID após autenticação e invalida o identificador anterior.
        code: |-
          <?php
          session_start(); // retoma sessao atual antes de autenticar

          $credenciaisValidas = true;

          if ($credenciaisValidas) {
              session_regenerate_id(true); // gera novo ID apos login
              $_SESSION["auth"] = ["id" => 9, "nome" => "Ana"]; // novo ID passa a representar este usuario
          }
        tags:
          - php
          - session-fixation
          - session_regenerate_id
          - seguranca
          - login
          - sessao
        callout:
          type: warn
          label: "Atenção:"
          text: regenerar ID faz diferença de segurança justamente no momento da autenticação.
  - id: cookies-relacao-sessao
    name: Cookies e relação com sessão
    layout: single
    entries:
      - title: Sessão e cookie trabalham juntos, mas têm papéis diferentes
        kicker: Use cada um para o que faz melhor
        description: Sessão é ideal para estado de autenticação e dados do servidor. Cookie é útil para preferências leves do cliente e identificação controlada.
        contentBlocks:
          - type: comparison-block
            title: Sessão x Cookie
            columns:
              - title: Sessão
                items:
                  - Dados ficam no servidor.
                  - Navegador guarda só o ID da sessão.
                  - Mais apropriada para estado de login.
              - title: Cookie
                items:
                  - Dado é salvo no navegador.
                  - Pode persistir entre visitas.
                  - Bom para preferências não sensíveis.
        code: |-
          <?php
          // Exemplo de cookie para preferência visual
          setcookie("tema", "dark", [
              "expires" => time() + 60 * 60 * 24 * 30,
              "path" => "/",
              "httponly" => false,
              "secure" => false,
              "samesite" => "Lax",
          ]);
        tags:
          - php
          - cookie
          - sessao
          - comparacao
          - setcookie
          - preferencia
        callout:
          type: danger
          label: "Perigo:"
          text: não salve senha, token mestre ou dados sensíveis em cookie comum.
  - id: httponly-secure-samesite
    name: HttpOnly, Secure e SameSite
    layout: single
    entries:
      - title: Configurações de cookie que elevam segurança da autenticação
        kicker: Hardening de sessão para reduzir XSS, CSRF e vazamento
        description: Esses atributos deixam o cookie de sessão mais resistente. Eles não eliminam todo risco, mas reduzem superfícies comuns de ataque.
        contentBlocks:
          - type: tech-list
            termHeader: Termo
            descriptionHeader: Função prática
            items:
              - term: PHPSESSID
                description: Cookie que carrega o identificador da sessão ativa no servidor.
              - term: HttpOnly
                description: Impede acesso ao cookie via JavaScript, reduzindo impacto de XSS no roubo de cookie.
              - term: Secure
                description: Envia cookie somente em HTTPS, evitando exposição em tráfego HTTP simples.
              - term: SameSite
                description: Controla envio do cookie entre sites e ajuda a reduzir risco de CSRF.
              - term: CSRF
                description: Ataque que força ação em nome do usuário autenticado sem intenção dele.
              - term: XSS
                description: Injeção de script em página confiável, podendo capturar dados e sessão.
              - term: session_regenerate_id(true)
                description: Troca o ID de sessão após login para reduzir session fixation.
        code: |-
          <?php
          // Defina antes de session_start() para endurecer o cookie da sessão
          session_set_cookie_params([
              "lifetime" => 0,      // expira ao fechar o navegador
              "path" => "/",        // vale para toda a aplicação
              "domain" => "",       // vazio = domínio atual
              "secure" => true,     // envia cookie apenas em HTTPS
              "httponly" => true,   // impede leitura via JavaScript
              "samesite" => "Lax",  // reduz envio cross-site em navegação comum
          ]);

          session_start();
        tags:
          - php
          - httponly
          - secure
          - samesite
          - phpsessid
          - seguranca
        callout:
          type: warn
          label: "Atenção:"
          text: "`HttpOnly` ajuda muito, mas não impede todos os ataques. Continue validando entrada, saída e lógica de autorização."
  - id: geracao-de-tokens
    name: Geração de tokens em PHP
    layout: single
    entries:
      - title: Gere token seguro com random_bytes() e bin2hex()
        kicker: Token imprevisível para autenticação e fluxo sensível
        description: Para segurança, token deve ser aleatório forte e não previsível. Em PHP, combinação prática é `random_bytes()` com `bin2hex()`.
        code: |-
          <?php
          session_start(); // token sera associado a sessao deste usuario

          $tokenSeguro = bin2hex(random_bytes(32));
          $_SESSION["password_reset_token"] = $tokenSeguro; // valor fica no servidor, nao exposto no cookie
          $_SESSION["password_reset_token_exp"] = time() + 900; // 15 minutos

          echo $tokenSeguro . PHP_EOL;
        tags:
          - php
          - token
          - random_bytes
          - bin2hex
          - seguranca
          - geracao
        callout:
          type: danger
          label: "Perigo:"
          text: não use `rand()` ou `uniqid()` para token de segurança.
  - id: tokens-autenticacao
    name: Tokens para autenticação
    layout: single
    entries:
      - title: Token de autenticação, token temporário e token CSRF têm objetivos diferentes
        kicker: Evite misturar papéis de token no mesmo fluxo
        description: Token de autenticação representa sessão/autorização, token temporário cobre ação com validade curta e token CSRF valida origem de formulário.
        contentBlocks:
          - type: comparison-block
            title: Token de autenticação x Token CSRF
            columns:
              - title: Token de autenticação
                items:
                  - Prova que usuário está autenticado.
                  - Usado para acesso em API/rotas protegidas.
                  - Pode ter expiração e renovação.
              - title: Token CSRF
                items:
                  - Prova que o formulário veio do seu app.
                  - Protege ações POST/PUT/DELETE no navegador.
                  - Normalmente vinculado à sessão atual.
          - type: flow-steps
            title: Fluxo de login com sessão
            steps:
              - Usuário envia credenciais para `/login.php`.
              - Servidor valida usuário e chama `session_regenerate_id(true)`.
              - Servidor grava dados mínimos em `$_SESSION["auth"]`.
              - Rotas protegidas validam `$_SESSION["auth"]["id"]`.
          - type: reference-card
            title: Token temporário
            description: Use para ação específica com validade curta, por exemplo reset de senha, confirmação de e-mail e aprovação de operação sensível.
        code: |-
          <?php
          session_start(); // sessao abre contexto para armazenar e validar token

          $authToken = bin2hex(random_bytes(32));
          $_SESSION["auth_token"] = $authToken;
          $_SESSION["auth_token_exp"] = time() + 900;

          $tokenRecebido = $_GET["token"] ?? "";
          $tokenValido = isset($_SESSION["auth_token"]) && hash_equals($_SESSION["auth_token"], $tokenRecebido);

          if (!$tokenValido || time() > $_SESSION["auth_token_exp"]) {
              http_response_code(401);
              echo "Token inválido ou expirado" . PHP_EOL;
              exit;
          }
        tags:
          - php
          - token
          - autenticacao
          - csrf
          - sessao
          - comparacao
  - id: token-csrf
    name: Token CSRF
    layout: single
    entries:
      - title: Gerar e validar CSRF token em formulário
        kicker: Proteção prática para ações autenticadas no navegador
        description: "Fluxo comum: gerar token no GET, enviar no formulário e validar no POST com `hash_equals`. Depois de validar, invalide token usado."
        contentBlocks:
          - type: flow-steps
            title: Fluxo de validação de CSRF
            steps:
              - No GET, gere token aleatório e salve em sessão.
              - Renderize token no `<input hidden>` do formulário.
              - No POST, compare token enviado com o token da sessão.
              - Se válido, processe ação e gere novo token para próximo ciclo.
        code: |-
          <?php
          session_start();

          if ($_SERVER["REQUEST_METHOD"] === "GET") {
              $_SESSION["csrf_token"] = bin2hex(random_bytes(32)); // token forte por ciclo de formulário
              $csrf = $_SESSION["csrf_token"];

              echo '<form method="POST">' . PHP_EOL;
              echo '  <input type="hidden" name="csrf_token" value="' . htmlspecialchars($csrf, ENT_QUOTES) . '">' . PHP_EOL; // escapa token ao renderizar HTML
              echo '  <button type="submit">Salvar</button>' . PHP_EOL;
              echo "</form>" . PHP_EOL;
          }

          if ($_SERVER["REQUEST_METHOD"] === "POST") {
              $tokenForm = $_POST["csrf_token"] ?? "";
              $tokenSessao = $_SESSION["csrf_token"] ?? "";

              if (!hash_equals($tokenSessao, $tokenForm)) { // comparação segura de token
                  http_response_code(419);
                  exit("Falha na validação CSRF");
              }

              unset($_SESSION["csrf_token"]); // invalida token já usado
              echo "Requisição aceita com CSRF válido" . PHP_EOL;
          }
        tags:
          - php
          - csrf
          - token
          - formulario
          - validacao
          - hash_equals
        callout:
          type: hint
          label: "Dica:"
          text: SameSite ajuda, mas não substitui token CSRF em fluxos críticos.
  - id: boas-praticas
    name: Boas práticas
    layout: single
    entries:
      - title: Checklist de segurança para sessão, cookie e token
        kicker: Pontos essenciais para reduzir risco em autenticação
        description: Esse checklist cobre as decisões que mais evitam falha comum em autenticação com PHP no dia a dia.
        contentBlocks:
          - type: checklist-block
            title: Antes de subir para produção
            items:
              - Chamar `session_start()` antes de usar `$_SESSION`.
              - Regenerar ID da sessão após login com `session_regenerate_id(true)`.
              - Usar cookies com `HttpOnly`.
              - Usar `Secure` em ambiente HTTPS.
              - Usar `SameSite` para reduzir risco de CSRF.
              - Gerar token com `random_bytes()` e `bin2hex()`.
              - Nunca usar `rand()` ou `uniqid()` para token de segurança.
              - Não salvar senha ou dados sensíveis diretamente em sessão/cookie.
              - Validar autenticação antes de acessar página protegida.
              - Destruir sessão corretamente no logout.
          - type: context-block
            variant: good-practice
            label: "Resumo:"
            text: sessão para estado autenticado, cookie endurecido para transporte e token forte para validações sensíveis.
        tags:
          - php
          - boas-praticas
          - sessao
          - cookie
          - token
          - seguranca
  - id: erros-comuns
    name: Erros comuns
    layout: single
    entries:
      - title: Falhas frequentes em autenticação com sessão, cookie e token
        kicker: Evite armadilhas que abrem brecha de segurança
        description: Boa parte dos incidentes vem de erros básicos repetidos. Revisar esses pontos evita retrabalho e diminui risco real de comprometimento.
        descriptionTone: warn
        contentBlocks:
          - type: checklist-block
            title: Erros que mais aparecem
            items:
              - Esquecer `session_start()`.
              - Enviar HTML/echo antes de configurar sessão, cookie ou header.
              - Salvar dados sensíveis em cookie.
              - Usar token previsível.
              - Não regenerar ID da sessão após login.
              - Confundir token CSRF com token de login.
              - Achar que `HttpOnly` impede todos os ataques.
          - type: context-block
            variant: common-error
            label: "Atenção:"
            text: o conjunto seguro vem da combinação de controles; um único atributo isolado não resolve todo o problema.
        tags:
          - php
          - erros-comuns
          - sessao
          - cookie
          - token
          - seguranca
  - id: exemplo-pratico-completo
    name: Exemplo prático completo
    layout: single
    entries:
      - title: Visão geral curta de arquivos para login e logout
        kicker: Como as peças se conectam sem criar um sistema grande
        description: Esse exemplo mostra apenas o papel de cada arquivo em um fluxo simples de autenticação com sessão e token CSRF.
        contentBlocks:
          - type: flow-steps
            title: Fluxo resumido
            steps:
              - "`config/session.php` define parâmetros de cookie e inicia sessão."
              - "`AuthService.php` valida credencial e prepara payload de autenticação."
              - "`AuthController.php` chama service, regenera ID e grava `$_SESSION`."
              - "`login.php` renderiza formulário e envia POST para autenticar."
              - "`logout.php` limpa sessão, destrói cookie e redireciona."
        code: |-
          <?php
          // config/session.php
          session_set_cookie_params([
              "lifetime" => 0,      // expira ao fechar navegador
              "path" => "/",        // cookie disponível em toda a app
              "secure" => true,     // só transmite em HTTPS
              "httponly" => true,   // bloqueia acesso via JavaScript
              "samesite" => "Lax",  // reduz risco de CSRF em navegação comum
          ]);
          session_start();

          // AuthService.php
          final class AuthService
          {
              public function autenticar(string $email, string $senha): ?array
              {
                  if ($email === "ana@empresa.com" && $senha === "123456") {
                      return ["id" => 1, "nome" => "Ana", "perfil" => "admin"];
                  }

                  return null;
              }
          }

          // AuthController.php
          require __DIR__ . "/config/session.php";
          $service = new AuthService();
          $usuario = $service->autenticar($_POST["email"] ?? "", $_POST["senha"] ?? "");

          if ($usuario) {
              session_regenerate_id(true); // evita reaproveitar ID antigo após login
              $_SESSION["auth"] = [
                  "id" => $usuario["id"],
                  "nome" => $usuario["nome"],
                  "perfil" => $usuario["perfil"],
              ];
          }

          // login.php
          require __DIR__ . "/config/session.php";
          $_SESSION["csrf_token"] = bin2hex(random_bytes(32)); // token anti-CSRF ligado à sessão atual

          // logout.php
          require __DIR__ . "/config/session.php";
          $_SESSION = [];
          session_destroy();
        tags:
          - php
          - exemplo-pratico
          - sessao
          - authservice
          - authcontroller
          - logout
