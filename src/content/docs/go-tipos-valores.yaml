id: go-tipos-valores
title: "Go: Tipos e valores"
subtitle: Guia prático para valores zero, ponteiros, structs literais, composição e a regra de nomes exportados em Go.
searchPlaceholder: Buscar zero value, ponteiro, struct, exportado ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Tipos básicos no mesmo programa
  kicker: Declarar e imprimir
  description: Use `var` para declarar com tipo explícito ou `:=` dentro de funções para inferência. Compare com valores zero antes de assumir que um campo foi preenchido.
  steps:
    - "Crie um módulo com `go mod init` (ver `Go: Módulos`)."
    - Cole o exemplo abaixo em `main.go` e execute `go run .`.
  codeLanguage: go
  code: |-
    package main

    import "fmt"

    func main() {
    	var i int
    	var s string
    	var p *int
    	fmt.Printf("i=%d s=%q p=%v\n", i, s, p)
    }
  callout:
    type: hint
    label: "Documentação relacionada:"
    text: "para erros como valores (`error` pode ser nil), veja `Go: Erros` no hub."
sections:
  - id: zero-values
    name: Valores zero
    layout: single
    entries:
      - title: Zero value por tipo
        kicker: Estado inicial seguro
        description: "Tipos têm valor zero: `0` para números, `false` para bool, string vazia para o tipo string, `nil` para ponteiros, slices, maps, canais e interfaces. Structs têm campos no respectivo zero."
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          type Config struct {
          	Port int
          	Host string
          }

          func main() {
          	var c Config
          	fmt.Printf("%+v\n", c)
          }
        output: "{Port:0 Host:}"
        tags:
          - go
          - zero value
          - struct
          - inicializacao
      - title: Comparar com zero em vez de "vazio" mágico
        kicker: Idioma explícito
        description: Go não tem `undefined` como JavaScript. Para saber se um `int` foi definido semanticamente, use ponteiro, `bool` extra ou um tipo opcional (`sql.NullInt64`, etc.) conforme o domínio.
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          func main() {
          	var n int
          	fmt.Println(n == 0)
          }
        output: "true"
        tags:
          - go
          - comparacao
          - zero
          - idioma
  - id: ponteiros
    name: Ponteiros
    layout: single
    entries:
      - title: Operador & e *
        kicker: Endereço e desreferência
        description: "`&x` obtém o endereço de `x`. `*p` lê ou escreve o valor apontado. Passar ponteiro evita copiar structs grandes e permite funções mutarem estado de forma explícita."
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          func dobra(p *int) {
          	*p *= 2
          }

          func main() {
          	x := 3
          	dobra(&x)
          	fmt.Println(x)
          }
        output: "6"
        tags:
          - go
          - ponteiro
          - endereco
          - referencia
      - title: new(T) vs literal &T{}
        kicker: Alocação na heap quando escapa
        description: '`new(T)` retorna `*T` com campos em zero. `&Person{Name: "Ana"}` cria um valor e já retorna ponteiro. Na prática literais são mais legíveis para structs.'
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          type Person struct {
          	Name string
          }

          func main() {
          	p := &Person{Name: "Ana"}
          	fmt.Println(p.Name)
          }
        output: Ana
        tags:
          - go
          - new
          - literal
          - struct
          - ponteiro
  - id: structs-e-export
    name: Structs e exportação
    layout: single
    entries:
      - title: Campos e métodos exportados
        kicker: Maiúscula inicial = público ao pacote
        description: Identificadores que começam por maiúscula são exportados (visíveis em outros pacotes). Minúscula fica privado ao pacote. Aplica-se a campos, funções, métodos e tipos.
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          type Conta struct {
          	Titular string // exportado
          	saldo   int      // privado ao pacote main
          }

          func (c *Conta) Depositar(v int) {
          	c.saldo += v
          }

          func (c *Conta) Saldo() int {
          	return c.saldo
          }

          func main() {
          	c := Conta{Titular: "Bruno"}
          	c.Depositar(10)
          	fmt.Println(c.Titular, c.Saldo())
          }
        output: Bruno 10
        tags:
          - go
          - exportado
          - struct
          - encapsulamento
          - pacote
      - title: Composição em vez de herança clássica
        kicker: Struct embutido
        description: Go não tem `extends`. Incorpora um tipo anônimo para promover métodos e campos (embedding). Use com moderação para não obscurecer onde vem cada método.
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          type Logger struct{ Prefix string }

          func (l Logger) Log(msg string) {
          	fmt.Println(l.Prefix + msg)
          }

          type Service struct {
          	Logger
          }

          func main() {
          	s := Service{Logger: Logger{Prefix: "[svc] "}}
          	s.Log("ok")
          }
        output: "[svc] ok"
        tags:
          - go
          - composicao
          - embedding
          - struct
  - id: decisao-rapida
    name: Decisão Rápida
    layout: single
    entries:
      - title: Atalho mental para tipos, ponteiros e structs
        kicker: Zero value, referência e visibilidade
        description: Use este resumo para decidir rápido entre valor e ponteiro, e o que exportar de um pacote.
        descriptionTone: default
        contentBlocks:
          - type: reference-card
            title: Mapa de decisão
            items:
              - "Valor zero (`0`, `\"\"`, `nil`, `false`) antes de assumir que um campo foi preenchido de propósito."
              - "`&x` para endereço, `*p` para ler ou escrever o valor apontado."
              - "Ponteiro quando a struct é grande ou a função precisa alterar o valor original."
              - "Literal `&Tipo{...}` no lugar de `new(Tipo)` quando quiser inicializar campos direto."
              - "Maiúscula inicial para exportar campo, método, função ou tipo ao pacote."
              - "Embedding de struct para compor comportamento, não para simular herança."
          - type: context-block
            title: Armadilha comum
            variant: common-error
            label: "Cuidado:"
            text: tratar `int` zerado como \"não preenchido\". Se ausência de valor for um estado válido no domínio, use ponteiro, um `bool` extra ou um tipo como `sql.NullInt64`.
        tags:
          - go
          - zero value
          - ponteiro
          - struct
          - decisao
tech: go
