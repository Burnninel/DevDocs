id: php-arrays
title: "PHP: Manipulando Arrays"
subtitle: Guia prático e mais completo para criar, transformar, buscar, ordenar e combinar arrays no PHP.
searchPlaceholder: Buscar função, comando ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: php
defaultRunnable: true
defaultSectionLayout: single
quickStart:
  title: Como testar os exemplos desta documentação
  kicker: Requisitos e execução no terminal
  description: Para acompanhar os exemplos, você só precisa do PHP CLI instalado e acessível no terminal.
  steps:
    - Verifique se o PHP está disponível com `php --version`.
    - Crie um arquivo `.php`, por exemplo `arrays.php`.
    - Cole no arquivo um dos exemplos desta página.
    - Execute no terminal com `php arrays.php`.
  codeLanguage: shell
  code: |-
    php --version
    php arrays.php
  callout:
    type: hint
    label: "Dica:"
    text: se o comando `php` não for reconhecido, instale o PHP CLI e adicione o executável ao `PATH` do sistema.
sections:
  - id: base
    name: Base
    layout: single
    entries:
      - title: Criar arrays indexados e associativos
        kicker: Entender a estrutura antes de manipular
        description: Array indexado é melhor para listas; array associativo é melhor para dados nomeados. Saber essa diferença ajuda a escolher a função certa depois.
        descriptionTone: default
        code: |-
          <?php
          $nomes = ["Ana", "Bruno", "Carla"]; // Array indexado
          $usuario = [ // Array associativo
              "nome" => "Ana",
              "email" => "ana@email.com",
              "ativo" => true,
          ];

          echo $nomes[1] . PHP_EOL;
          echo $usuario["email"] . PHP_EOL;

          print_r($nomes);
          print_r($usuario);

          /*
          Saída:
          Bruno
          ana@email.com
          Array
          (
              [0] => Ana
              [1] => Bruno
              [2] => Carla
          )
          Array
          (
              [nome] => Ana
              [email] => ana@email.com
              [ativo] => 1
          )
          */
        tags:
          - php
          - array
          - indexado
          - associativo
          - criar
          - base
      - title: Trabalhar com arrays associativos multidimensionais
        kicker: Estruturas aninhadas para dados reais
        description: Array associativo multidimensional é um array de arrays com chaves nomeadas. Ele é muito usado para representar usuários, pedidos, configurações e respostas de API com vários níveis.
        descriptionTone: default
        code: |-
          <?php
          $empresa = [
              "nome" => "DevDocs",
              "endereco" => [
                  "cidade" => "Sao Paulo",
                  "uf" => "SP",
              ],
              "times" => [
                  [
                      "nome" => "Plataforma",
                      "lider" => "Ana",
                  ],
                  [
                      "nome" => "Produto",
                      "lider" => "Bruno",
                  ],
              ],
          ];

          echo $empresa["nome"] . PHP_EOL;
          echo $empresa["endereco"]["cidade"] . " - " . $empresa["endereco"]["uf"] . PHP_EOL;
          echo $empresa["times"][1]["lider"] . PHP_EOL;

          $cep = $empresa["endereco"]["cep"] ?? "não informado"; // Fallback se a chave não existir
          echo "CEP: $cep" . PHP_EOL;

          $empresa["times"][0]["lider"] = "Carla"; // Atualiza valor aninhado
          print_r($empresa["times"][0]);

          /*
          Saída:
          DevDocs
          Sao Paulo - SP
          Bruno
          CEP: não informado
          Array
          (
              [nome] => Plataforma
              [lider] => Carla
          )
          */
        tags:
          - php
          - array
          - associativo
          - multidimensional
          - aninhado
          - base
        callout:
          type: hint
          label: "Dica:"
          text: para evitar aviso de índice/chave inexistente em níveis profundos, valide com `isset` ou use coalescência nula (`??`).
      - title: Ler, alterar e adicionar valores
        kicker: Acesso por índice e por chave
        description: Use colchetes para acessar e sobrescrever valores. Para listas, `$array[] = valor` continua sendo a forma mais direta de adicionar no final.
        descriptionTone: default
        code: |-
          <?php
          $frutas = ["maçã", "banana", "uva"];
          $frutas[1] = "laranja";
          $frutas[] = "melancia";

          $usuario = ["nome" => "Bruno", "cargo" => "dev"];
          $usuario["cargo"] = "tech lead";
          $usuario["time"] = "plataforma";

          echo $frutas[0] . PHP_EOL;
          echo $frutas[1] . PHP_EOL;
          echo $usuario["cargo"] . PHP_EOL;

          print_r($frutas);
          print_r($usuario);

          /*
          Saída:
          maçã
          laranja
          tech lead
          Array
          (
              [0] => maçã
              [1] => laranja
              [2] => uva
              [3] => melancia
          )
          Array
          (
              [nome] => Bruno
              [cargo] => tech lead
              [time] => plataforma
          )
          */
        tags:
          - php
          - array
          - acessar
          - alterar
          - adicionar
          - indice
          - chave
      - title: Adicionar e remover itens
        kicker: push, pop, shift, unshift e unset
        description: "Essas operações aparecem o tempo todo. Assinaturas úteis: `array_push($array, $valor...)`, `array_unshift($array, $valor...)`, `array_pop($array)` e `array_shift($array)`. Em `unset($array[$indice])`, você remove uma posição específica."
        descriptionTone: default
        code: |-
          <?php
          $itens = ["a", "b", "c"];

          array_push($itens, "d"); // Adiciona no fim
          array_unshift($itens, "inicio"); // Adiciona no início
          $ultimo = array_pop($itens); // Remove do fim e retorna
          $primeiro = array_shift($itens); // Remove do início e retorna
          unset($itens[1]); // Remove índice específico

          print_r($itens);
          echo "Primeiro removido: $primeiro" . PHP_EOL;
          echo "Último removido: $ultimo" . PHP_EOL;

          /*
          Saída:
          Array
          (
              [0] => a
              [2] => c
          )
          Primeiro removido: inicio
          Último removido: d
          */
        tags:
          - php
          - array_push
          - array_pop
          - array_shift
          - array_unshift
          - unset
          - remover
          - adicionar
        callout:
          type: warn
          label: "Atenção:"
          text: depois de `unset`, os índices podem ficar não sequenciais. Se precisar reindexar, use `array_values`.
      - title: Percorrer arrays com foreach
        kicker: Leitura simples e legível
        description: "`foreach` é a forma mais comum de iterar arrays no PHP. Em arrays associativos, capture tanto a chave quanto o valor."
        descriptionTone: default
        code: |-
          <?php
          $notas = ["Ana" => 9, "Bruno" => 7, "Carla" => 10];

          foreach ($notas as $nome => $nota) {
              echo "$nome tirou $nota" . PHP_EOL;
          }

          /*
          Saída:
          Ana tirou 9
          Bruno tirou 7
          Carla tirou 10
          */
        tags:
          - php
          - foreach
          - iterar
          - loop
          - chave
          - valor
      - title: Alterar itens com foreach por referência
        kicker: Quando você quer modificar o array original
        description: Use `foreach (&$item)` quando precisar alterar os valores diretamente durante a iteração. Depois do loop, faça `unset($item)` para evitar efeitos colaterais com a referência.
        descriptionTone: default
        code: |-
          <?php
          $precos = [100, 250, 400];

          foreach ($precos as &$preco) { // &$preco altera o array original
              $preco = $preco * 1.1;
          }
          unset($preco); // Quebra a referência

          print_r($precos);

          /*
          Saída:
          Array
          (
              [0] => 110
              [1] => 275
              [2] => 440
          )
          */
        tags:
          - php
          - foreach
          - referencia
          - alterar
          - mutacao
          - loop
        callout:
          type: warn
          label: "Atenção:"
          text: depois de usar `foreach` por referência, faça `unset($item)` para não manter a última posição referenciada por acidente.
      - title: Contar itens e reindexar array
        kicker: count e array_values
        description: "`count($array)` mostra o tamanho do array. `array_values($array)` é útil depois de filtros ou `unset`, quando você precisa voltar para índices sequenciais."
        descriptionTone: default
        code: |-
          <?php
          $ids = [10, 20, 30];
          unset($ids[1]);

          echo "Quantidade: " . count($ids) . PHP_EOL;
          print_r($ids);
          print_r(array_values($ids));

          /*
          Saída:
          Quantidade: 2
          Array
          (
              [0] => 10
              [2] => 30
          )
          Array
          (
              [0] => 10
              [1] => 30
          )
          */
        tags:
          - php
          - count
          - array_values
          - reindexar
          - quantidade
          - base
  - id: transformacao
    name: Transformação
    layout: single
    entries:
      - title: Filtrar itens com array_filter
        kicker: Manter apenas o que interessa
        description: Use `array_filter($array, $callback)` quando quiser reduzir uma lista com base em regra. O primeiro parâmetro é a lista e o segundo é a função de filtro; ele preserva as chaves originais.
        descriptionTone: default
        code: |-
          <?php
          $numeros = [1, 2, 3, 4, 5, 6];
          $pares = array_filter($numeros, fn($n) => $n % 2 === 0); // Mantém apenas pares

          print_r($pares);
          print_r(array_values($pares)); // Reindexa o resultado

          /*
          Saída:
          Array
          (
              [1] => 2
              [3] => 4
              [5] => 6
          )
          Array
          (
              [0] => 2
              [1] => 4
              [2] => 6
          )
          */
        tags:
          - php
          - array_filter
          - filtro
          - transformacao
          - pares
          - reindexar
      - title: Mapear itens com array_map
        kicker: Transformar cada elemento sem alterar o original
        description: "`array_map($callback, $array)` cria um novo array a partir de cada item original. Aqui a ordem muda: a função vem primeiro e o array depois."
        descriptionTone: default
        code: |-
          <?php
          $precos = [10, 25, 39.9];
          $precosFormatados = array_map(
              fn($valor) => "R$ " . number_format($valor, 2, ",", "."),
              $precos
          );

          print_r($precosFormatados);

          /*
          Saída:
          Array
          (
              [0] => R$ 10,00
              [1] => R$ 25,00
              [2] => R$ 39,90
          )
          */
        tags:
          - php
          - array_map
          - map
          - transformacao
          - formatacao
      - title: Reduzir valores com array_reduce
        kicker: Consolidar vários itens em um único resultado
        description: "`array_reduce($array, $callback, $valorInicial)` serve para somar, agrupar, acumular ou montar estruturas derivadas. Primeiro vem a lista, depois a regra e por fim o valor inicial."
        descriptionTone: default
        code: |-
          <?php
          $pedidos = [
              ["produto" => "Mouse", "valor" => 120],
              ["produto" => "Teclado", "valor" => 250],
              ["produto" => "Headset", "valor" => 180],
          ];

          $total = array_reduce(
              $pedidos,
              fn($acc, $pedido) => $acc + $pedido["valor"],
              0
          );

          echo "Total: R$ $total" . PHP_EOL;

          /*
          Saída:
          Total: R$ 550
          */
        tags:
          - php
          - array_reduce
          - reduce
          - soma
          - agregacao
          - total
      - title: Extrair uma coluna com array_column
        kicker: Muito útil com listas de arrays associativos
        description: Quando você tem uma lista de registros, `array_column($registros, $coluna, $indiceOpcional)` evita loops manuais para pegar só uma propriedade. O terceiro parâmetro é opcional e define a chave do resultado.
        descriptionTone: default
        code: |-
          <?php
          $usuarios = [
              ["id" => 1, "nome" => "Ana", "email" => "ana@email.com"],
              ["id" => 2, "nome" => "Bruno", "email" => "bruno@email.com"],
              ["id" => 3, "nome" => "Carla", "email" => "carla@email.com"],
          ];

          $nomes = array_column($usuarios, "nome"); // Extrai uma coluna
          $emailsPorId = array_column($usuarios, "email", "id"); // Usa id como índice

          print_r($nomes);
          print_r($emailsPorId);

          /*
          Saída:
          Array
          (
              [0] => Ana
              [1] => Bruno
              [2] => Carla
          )
          Array
          (
              [1] => ana@email.com
              [2] => bruno@email.com
              [3] => carla@email.com
          )
          */
        tags:
          - php
          - array_column
          - extrair
          - coluna
          - usuarios
          - transformacao
  - id: busca-validacao
    name: Busca e Validação
    layout: single
    entries:
      - title: Checar existência de valor com in_array
        kicker: Verificação rápida em listas
        description: "`in_array($valor, $array, $estrito)` recebe primeiro o valor procurado e depois a lista. Use o terceiro parâmetro como `true` para comparação estrita e evitar bugs de tipo."
        descriptionTone: default
        code: |-
          <?php
          $perfis = ["admin", "editor", "viewer"];

          var_dump(in_array("editor", $perfis, true)); // true: encontrou valor
          var_dump(in_array(1, ["1", "2", "3"], true)); // false: tipos diferentes
          var_dump(in_array(1, ["1", "2", "3"], false)); // true: comparação frouxa

          /*
          Saída:
          bool(true)
          bool(false)
          bool(true)
          */
        tags:
          - php
          - in_array
          - buscar
          - valor
          - validacao
          - estrito
      - title: Checar existência de chave
        kicker: array_key_exists vs isset
        description: "`array_key_exists($chave, $array)` responde se a chave existe. Já `isset($array[$chave])` só retorna `true` quando a chave existe e o valor não é `null`."
        descriptionTone: default
        code: |-
          <?php
          $config = [
              "host" => "localhost",
              "porta" => null,
          ];

          var_dump(array_key_exists("porta", $config)); // true: chave existe
          var_dump(isset($config["porta"])); // false: valor é null

          /*
          Saída:
          bool(true)
          bool(false)
          */
        tags:
          - php
          - array_key_exists
          - isset
          - chave
          - associativo
          - validacao
        callout:
          type: hint
          label: "Dica:"
          text: prefira `array_key_exists` quando precisar diferenciar chave ausente de valor `null`.
      - title: Encontrar índice com array_search
        kicker: Recuperar a posição da primeira ocorrência
        description: "`array_search($valor, $array, $estrito)` retorna a chave ou índice encontrado. Sempre compare com `!== false`, porque índice `0` é um resultado válido."
        descriptionTone: default
        code: |-
          <?php
          $stack = ["cache", "queue", "db"];
          $indice = array_search("cache", $stack, true); // Busca estrita

          if ($indice !== false) { // 0 também é resultado válido
              echo "Encontrado no índice: $indice" . PHP_EOL;
          }

          /*
          Saída:
          Encontrado no índice: 0
          */
        tags:
          - php
          - array_search
          - indice
          - buscar
          - primeira ocorrencia
          - "false"
        callout:
          type: warn
          label: "Atenção:"
          text: não use `if ($indice)` para validar o retorno, porque o índice `0` será tratado como falso.
  - id: ordenacao
    name: Ordenação
    layout: single
    entries:
      - title: Ordenar arrays indexados
        kicker: sort e rsort reindexam o array
        description: "`sort($array)` ordena em ordem crescente e `rsort($array)` em ordem decrescente. Ambas recebem o array por referência e reorganizam os índices."
        descriptionTone: default
        code: |-
          <?php
          $notas = [8, 6, 10, 7];

          sort($notas);
          print_r($notas);

          rsort($notas);
          print_r($notas);

          /*
          Saída:
          Array
          (
              [0] => 6
              [1] => 7
              [2] => 8
              [3] => 10
          )
          Array
          (
              [0] => 10
              [1] => 8
              [2] => 7
              [3] => 6
          )
          */
        tags:
          - php
          - sort
          - rsort
          - ordenacao
          - crescente
          - decrescente
      - title: Ordenar arrays associativos
        kicker: asort, arsort, ksort e krsort
        description: Em arrays associativos, escolha se quer ordenar por valor (`asort`, `arsort`) ou por chave (`ksort`, `krsort`). Todas usam assinatura `funcao($array)` e preservam a associação chave/valor.
        descriptionTone: default
        code: |-
          <?php
          $ranking = [
              "ana" => 120,
              "bruno" => 95,
              "carla" => 140,
          ];

          arsort($ranking);
          print_r($ranking);

          ksort($ranking);
          print_r($ranking);

          /*
          Saída:
          Array
          (
              [carla] => 140
              [ana] => 120
              [bruno] => 95
          )
          Array
          (
              [ana] => 120
              [bruno] => 95
              [carla] => 140
          )
          */
        tags:
          - php
          - asort
          - arsort
          - ksort
          - krsort
          - associativo
          - ordenacao
      - title: Ordenar com regra personalizada usando usort
        kicker: Quando sort e asort não bastam
        description: "`usort($array, $comparador)` permite definir sua regra de ordenação. O comparador deve retornar negativo, zero ou positivo para indicar a ordem."
        descriptionTone: default
        code: |-
          <?php
          $produtos = [
              ["nome" => "Monitor", "preco" => 899],
              ["nome" => "Mouse", "preco" => 120],
              ["nome" => "Teclado", "preco" => 250],
          ];

          usort($produtos, fn($a, $b) => $a["preco"] <=> $b["preco"]);

          print_r($produtos);

          /*
          Saída:
          Array
          (
              [0] => Array
                  (
                      [nome] => Mouse
                      [preco] => 120
                  )
              [1] => Array
                  (
                      [nome] => Teclado
                      [preco] => 250
                  )
              [2] => Array
                  (
                      [nome] => Monitor
                      [preco] => 899
                  )
          )
          */
        tags:
          - php
          - usort
          - ordenacao
          - customizada
          - comparacao
          - preco
      - title: Ordenar preservando chaves com uasort
        kicker: Regra customizada sem perder a associação
        description: "`uasort($array, $comparador)` segue a mesma ideia do `usort`, mas preserva as chaves originais enquanto aplica sua função de comparação."
        descriptionTone: default
        code: |-
          <?php
          $ranking = [
              "ana" => ["pontos" => 120],
              "bruno" => ["pontos" => 95],
              "carla" => ["pontos" => 140],
          ];

          uasort($ranking, fn($a, $b) => $b["pontos"] <=> $a["pontos"]);

          print_r($ranking);

          /*
          Saída:
          Array
          (
              [carla] => Array
                  (
                      [pontos] => 140
                  )
              [ana] => Array
                  (
                      [pontos] => 120
                  )
              [bruno] => Array
                  (
                      [pontos] => 95
                  )
          )
          */
        tags:
          - php
          - uasort
          - ordenacao
          - associativo
          - chaves
          - customizada
  - id: composicao
    name: Composição
    layout: single
    entries:
      - title: Mesclar arrays
        kicker: array_merge e operador + têm comportamentos diferentes
        description: "`array_merge($a, $b, ...)` junta os arrays da esquerda para a direita e, em chaves repetidas, os valores mais à direita vencem. Já o operador `+` preserva os valores da esquerda quando há conflito."
        descriptionTone: default
        code: |-
          <?php
          $a = ["php", "js"];
          $b = ["go", "rust"];

          print_r(array_merge($a, $b)); // Concatena listas

          $c1 = ["nome" => "Ana", "cargo" => "dev"];
          $c2 = ["cargo" => "lead", "time" => "plataforma"];

          print_r(array_merge($c1, $c2)); // Em conflito, vence o da direita
          print_r($c1 + $c2); // Em conflito, preserva o da esquerda

          /*
          Saída:
          Array
          (
              [0] => php
              [1] => js
              [2] => go
              [3] => rust
          )
          Array
          (
              [nome] => Ana
              [cargo] => lead
              [time] => plataforma
          )
          Array
          (
              [nome] => Ana
              [cargo] => dev
              [time] => plataforma
          )
          */
        tags:
          - php
          - array_merge
          - merge
          - operador +
          - composicao
        callout:
          type: danger
          label: "Perigo:"
          text: em arrays associativos, `array_merge` pode sobrescrever chaves com mesmo nome.
      - title: Mesclar com array_replace e array_replace_recursive
        kicker: Substituição simples vs profunda
        description: "`array_replace($base, $override)` substitui no primeiro nível, usando o segundo array para sobrescrever o primeiro. `array_replace_recursive($base, $override)` faz isso também nos níveis internos."
        descriptionTone: default
        code: |-
          <?php
          $configPadrao = [
              "db" => [
                  "host" => "localhost",
                  "porta" => 3306,
                  "flags" => ["persistente" => false],
              ],
              "cache" => true,
          ];

          $configEnv = [
              "db" => [
                  "porta" => 5432,
                  "flags" => ["persistente" => true],
              ],
              "cache" => false,
          ];

          $simples = array_replace($configPadrao, $configEnv); // Troca só no 1º nível
          $profundo = array_replace_recursive($configPadrao, $configEnv); // Troca também níveis internos

          print_r($simples["db"]);
          print_r($profundo["db"]);

          /*
          Saída:
          Array
          (
              [porta] => 5432
              [flags] => Array
                  (
                      [persistente] => 1
                  )
          )
          Array
          (
              [host] => localhost
              [porta] => 5432
              [flags] => Array
                  (
                      [persistente] => 1
                  )
          )
          */
        tags:
          - php
          - array_replace
          - array_replace_recursive
          - merge
          - substituicao
          - composicao
        callout:
          type: hint
          label: "Dica:"
          text: quando quiser preservar campos internos existentes, prefira `array_replace_recursive`.
      - title: Flatten simples de matriz
        kicker: Juntar subarrays em uma única lista
        description: Quando você tem uma matriz simples, o spread em `array_merge(...$grupos)` expande cada subarray como parâmetro da função. É uma saída boa antes de filtrar, ordenar ou mapear.
        descriptionTone: default
        code: |-
          <?php
          $grupos = [
              ["ana", "bruno"],
              ["carla"],
              ["diego", "erika"],
          ];

          $nomes = array_merge(...$grupos);
          print_r($nomes);

          /*
          Saída:
          Array
          (
              [0] => ana
              [1] => bruno
              [2] => carla
              [3] => diego
              [4] => erika
          )
          */
        tags:
          - php
          - flatten
          - array_merge
          - multidimensional
          - normalizacao
      - title: Quebrar e juntar strings com explode e implode
        kicker: Arrays aparecem muito na fronteira com texto
        description: "`explode($separador, $texto)` quebra uma string em array. `implode($separador, $array)` faz o caminho inverso, então a ordem dos parâmetros muda entre as duas."
        descriptionTone: default
        code: |-
          <?php
          $csv = "php,js,go,rust";
          $tecnologias = explode(",", $csv); // String -> array

          print_r($tecnologias);
          echo implode(" | ", $tecnologias) . PHP_EOL; // Array -> string

          /*
          Saída:
          Array
          (
              [0] => php
              [1] => js
              [2] => go
              [3] => rust
          )
          php | js | go | rust
          */
        tags:
          - php
          - explode
          - implode
          - strings
          - array
          - composicao
      - title: Comparar listas com array_diff e array_intersect
        kicker: Descobrir o que entrou, saiu ou coincide
        description: "`array_diff($a, $b)` mostra o que existe em `$a` e não em `$b`. `array_intersect($a, $b)` mostra apenas os valores em comum entre eles."
        descriptionTone: default
        code: |-
          <?php
          $permissoesAtuais = ["ler", "editar", "publicar"];
          $permissoesNovas = ["ler", "editar", "excluir"];

          $removidas = array_diff($permissoesAtuais, $permissoesNovas); // Existe em atuais e não em novas
          $mantidas = array_intersect($permissoesAtuais, $permissoesNovas); // Existe nas duas listas

          print_r($removidas);
          print_r($mantidas);

          /*
          Saída:
          Array
          (
              [2] => publicar
          )
          Array
          (
              [0] => ler
              [1] => editar
          )
          */
        tags:
          - php
          - array_diff
          - array_intersect
          - comparar
          - listas
          - composicao
  - id: utilidades-praticas
    name: Utilidades Práticas
    layout: single
    entries:
      - title: Pegar só as chaves ou só os valores
        kicker: array_keys e array_values
        description: "`array_keys($array)` retorna apenas as chaves e `array_values($array)` retorna apenas os valores. Ambas são úteis para depuração, validação e comparações rápidas."
        descriptionTone: default
        code: |-
          <?php
          $config = [
              "host" => "localhost",
              "porta" => 3306,
              "database" => "app",
          ];

          print_r(array_keys($config)); // Só chaves
          print_r(array_values($config)); // Só valores

          /*
          Saída:
          Array
          (
              [0] => host
              [1] => porta
              [2] => database
          )
          Array
          (
              [0] => localhost
              [1] => 3306
              [2] => app
          )
          */
        tags:
          - php
          - array_keys
          - array_values
          - chaves
          - valores
          - utilidades
      - title: Comparar arrays por chave
        kicker: array_diff_key e array_intersect_key
        description: Quando o que importa são as chaves (e não os valores), use `array_diff_key($a, $b)` para achar chaves exclusivas de `$a` e `array_intersect_key($a, $b)` para achar chaves em comum.
        descriptionTone: default
        code: |-
          <?php
          $payloadA = [
              "id" => 10,
              "nome" => "Ana",
              "email" => "ana@email.com",
              "ativo" => true,
          ];

          $payloadB = [
              "id" => 99,
              "nome" => "Bruno",
              "time" => "plataforma",
              "ativo" => false,
          ];

          $somenteEmA = array_diff_key($payloadA, $payloadB); // Chaves exclusivas de A
          $chavesEmComum = array_intersect_key($payloadA, $payloadB); // Chaves presentes em ambos

          print_r(array_keys($somenteEmA));
          print_r(array_keys($chavesEmComum));

          /*
          Saída:
          Array
          (
              [0] => email
          )
          Array
          (
              [0] => id
              [1] => nome
              [2] => ativo
          )
          */
        tags:
          - php
          - array_diff_key
          - array_intersect_key
          - chaves
          - comparacao
          - utilidades
      - title: Remover duplicados com array_unique
        kicker: Limpeza simples de listas
        description: "`array_unique($array)` remove duplicados mantendo a primeira ocorrência. Se precisar de índices sequenciais no resultado, aplique `array_values($array)` depois."
        descriptionTone: default
        code: |-
          <?php
          $tags = ["php", "js", "php", "go", "js"];
          $tagsUnicas = array_values(array_unique($tags)); // Remove duplicados e reindexa

          print_r($tagsUnicas);

          /*
          Saída:
          Array
          (
              [0] => php
              [1] => js
              [2] => go
          )
          */
        tags:
          - php
          - array_unique
          - duplicados
          - limpeza
          - tags
          - utilidades
      - title: Dividir lista em pedaços com array_chunk
        kicker: Lotes, grids e processamento em blocos
        description: "`array_chunk($array, $tamanho)` divide a lista em blocos. O primeiro parâmetro é a lista completa e o segundo é o tamanho de cada lote."
        descriptionTone: default
        code: |-
          <?php
          $usuarios = ["Ana", "Bruno", "Carla", "Diego", "Erika"];
          $lotes = array_chunk($usuarios, 2); // Divide em blocos de 2

          print_r($lotes);

          /*
          Saída:
          Array
          (
              [0] => Array
                  (
                      [0] => Ana
                      [1] => Bruno
                  )
              [1] => Array
                  (
                      [0] => Carla
                      [1] => Diego
                  )
              [2] => Array
                  (
                      [0] => Erika
                  )
          )
          */
        tags:
          - php
          - array_chunk
          - lotes
          - dividir
          - listas
          - utilidades
  - id: decisao-rapida
    name: Decisão Rápida
    layout: single
    entries:
      - title: Quando usar cada grupo de funções
        kicker: Atalho mental para escolher mais rápido
        description: "Use esta leitura rápida como mapa: `array_map` para transformar, `array_filter` para filtrar, `array_reduce` para acumular, `array_column` para extrair uma coluna, `array_merge` ou `array_replace` para juntar/substituir, `array_diff`/`array_intersect` para comparar valores, `array_diff_key`/`array_intersect_key` para comparar chaves, `sort`/`asort`/`usort`/`uasort` para ordenar e `array_values` para reindexar."
        descriptionTone: default
        contentBlocks:
          - type: reference-card
            title: Mapa de decisão
            items:
              - "`array_map` para transformar cada item."
              - "`array_filter` para filtrar por condição."
              - "`array_reduce` para acumular em um valor final."
              - "`array_column` para extrair uma coluna."
              - "`array_merge` ou `array_replace` para juntar ou sobrescrever estruturas."
              - "`array_diff` e `array_intersect` para comparar valores."
              - "`array_diff_key` e `array_intersect_key` para comparar chaves."
              - "`sort`, `asort`, `usort` e `uasort` para ordenar."
              - "`array_values` para reindexar depois de filtro ou `unset`."
        tags:
          - php
          - guia
          - decisao
          - map
          - filter
          - reduce
          - ordenacao
          - comparacao
        callout:
          type: hint
          label: "Dica:"
          text: "se estiver em dúvida, primeiro pense no objetivo: transformar, filtrar, acumular, comparar, ordenar ou reindexar. A função costuma vir naturalmente depois disso."
