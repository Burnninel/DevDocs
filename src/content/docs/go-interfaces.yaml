id: go-interfaces
title: "Go: Interfaces"
subtitle: Guia prático para satisfação implícita de interfaces, desenho com interfaces pequenas e contratos com io.Reader e io.Writer.
searchPlaceholder: Buscar interface, Reader, Writer, Stringer ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Uma interface e duas implementações
  kicker: Satisfação em tempo de compilação
  description: "Em Go não escreves `implements`. Se o tipo tem os métodos certos, já satisfaz a interface. Relembre structs e métodos em `Go: Tipos e valores` no hub."
  steps:
    - "Crie módulo com `go mod init` (ver `Go: Módulos`)."
    - Cole o exemplo completo em `main.go` e execute `go run .`.
  codeLanguage: go
  code: |-
    package main

    import "fmt"

    type Greeter interface {
    	Greet() string
    }

    type Formal struct{ Name string }

    func (f Formal) Greet() string {
    	return "Bom dia, " + f.Name
    }

    type Casual struct{ Name string }

    func (c Casual) Greet() string {
    	return "Ola " + c.Name
    }

    func sayHello(g Greeter) {
    	fmt.Println(g.Greet())
    }

    func main() {
    	sayHello(Formal{Name: "Ana"})
    	sayHello(Casual{Name: "Bruno"})
    }
  callout:
    type: hint
    label: "Documentação relacionada:"
    text: "exportação de métodos (maiúscula) alinha com `Go: Tipos e valores`."
sections:
  - id: satisfacao-implicita
    name: Satisfação implícita
    layout: single
    entries:
      - title: Interface é conjunto de métodos
        kicker: Contrato comportamental
        description: Uma variável de tipo interface guarda um valor concreto e um tipo dinâmico. Só podes chamar métodos que a interface declara. O compilador verifica se o concreto satisfaz a interface.
        descriptionTone: default
        code: |-
          package main

          import "fmt"

          type Stringer interface {
          	String() string
          }

          type ID int

          func (id ID) String() string {
          	return fmt.Sprintf("ID-%d", id)
          }

          func printLine(s Stringer) {
          	fmt.Println(s.String())
          }

          func main() {
          	printLine(ID(42))
          }
        output: ID-42
        tags:
          - go
          - interface
          - Stringer
          - metodo
          - contrato
      - title: Interface vazia e any
        kicker: Go 1.18+
        description: "`interface{}` significa qualquer valor com qualquer método. O alias predefinido `any` é equivalente. Use com parcimónia: perde-se informação de tipo e costuma exigir type assertion ou `switch` por tipo."
        descriptionTone: warn
        code: |-
          package main

          import "fmt"

          func describe(v any) {
          	fmt.Printf("tipo=%T valor=%v\n", v, v)
          }

          func main() {
          	describe(10)
          	describe("texto")
          }
        output: |-
          tipo=int valor=10
          tipo=string valor=texto
        tags:
          - go
          - any
          - interface{}
          - tipo
  - id: io-reader-writer
    name: io.Reader e io.Writer
    layout: single
    entries:
      - title: Reader como contrato de leitura
        kicker: Streams e bytes
        description: "`io.Reader` declara `Read([]byte) (int, error)`. Muitas APIs aceitam `Reader` em vez de ficheiros concretos, o que facilita testes com `bytes.Reader` ou `strings.Reader`."
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"io"
          	"strings"
          )

          func main() {
          	r := strings.NewReader("abc")
          	buf := make([]byte, 2)
          	n, err := r.Read(buf)
          	if err != nil && err != io.EOF {
          		panic(err)
          	}
          	fmt.Println(n, string(buf[:n]))
          }
        output: 2 ab
        tags:
          - go
          - io.Reader
          - Read
          - strings
          - stream
        callout:
          type: hint
          label: "Erros e EOF:"
          text: "o padrão `(n, err)` e `io.EOF` ligam a `Go: Erros` no hub."
      - title: Writer e composição
        kicker: Escrever para buffer ou rede
        description: "`io.Writer` define `Write([]byte) (int, error)`. `fmt.Fprintf` escreve formato para qualquer `Writer`, incluindo `os.Stdout` ou `bytes.Buffer`."
        descriptionTone: default
        code: |-
          package main

          import (
          	"bytes"
          	"fmt"
          )

          func main() {
          	var buf bytes.Buffer
          	fmt.Fprintf(&buf, "total=%d", 3)
          	fmt.Println(buf.String())
          }
        output: total=3
        tags:
          - go
          - io.Writer
          - Fprintf
          - bytes.Buffer
  - id: desenho-interfaces
    name: Boas práticas de desenho
    layout: single
    entries:
      - title: Aceite interfaces, devolva structs concretas
        kicker: Proverbio útil
        description: Funções públicas costumam receber interfaces estreitas (`io.Reader`, `context.Context`) e devolver structs concretos ou `(T, error)`. Isso reduz acoplamento e facilita evoluir implementações.
        descriptionTone: default
        code: |-
          package main

          import "bytes"

          func NewBuffer() *bytes.Buffer {
          	return new(bytes.Buffer)
          }

          func main() {
          	_ = NewBuffer()
          }
        tags:
          - go
          - interface
          - acoplamento
          - api
          - design
      - title: Interfaces pequenas
        kicker: Um ou dois métodos por contrato
        description: "Interfaces grandes são difíceis de implementar e testar. Prefira compor: várias interfaces pequenas somam o mesmo poder com mais clareza."
        descriptionTone: default
        code: |
          package main

          type Reader interface {
          	Read(p []byte) (n int, err error)
          }

          type Closer interface {
          	Close() error
          }

          // ReadCloser combina os dois contratos.
          type ReadCloser interface {
          	Reader
          	Closer
          }

          func main() {}
        tags:
          - go
          - interface
          - composicao
          - ReadCloser
tech: go
order: 19
