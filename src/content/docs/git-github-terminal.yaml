id: git-github-terminal
title: "Git no dia a dia"
subtitle: "O comando certo em poucos segundos e caminhos para os fluxos de equipe."
cardDescription: "Status, diff, stage, commit e push. Comece aqui para escolher o guia da sua situação."
tech: git
order: 0
codeLanguage: bash
quickStart:
  title: "Antes de alterar qualquer coisa"
  description: "Confira a branch, as alterações e os commits recentes. Os exemplos funcionam com GitHub, GitLab e outros remotos."
  codeLanguage: bash
  code: |-
    git status
    git diff
    git log --oneline -5
  callout:
    type: hint
    label: "Convenção dos exemplos:"
    text: "Usamos `master` como base em vários fluxos. Troque por `main`, `develop` ou a branch de integração do projeto. Nomes de arquivos, branches e hashes são exemplos."
sections:
  - id: base
    name: "Base e consulta rápida"
    entries:
      - title: "Working tree → Stage → Commit local → Remote"
        kicker: "Onde está a sua alteração?"
        description: "`HEAD` aponta normalmente para a branch atual, que aponta para um commit. Editar um arquivo ainda não altera esse commit."
        contentBlocks:
          - type: flow-steps
            steps:
              - "**Working tree:** arquivos que você edita no disco."
              - "**Stage/index:** seleção do próximo commit; `git add` copia o estado atual dos arquivos para essa seleção."
              - "**Commit local:** `git commit` registra o stage na branch. Pode ficar dias só na sua máquina."
              - "**Remote:** `git push` envia commits e atualiza a branch no servidor; não envia edições sem commit."
        tags: [working tree, stage, index, HEAD, commit local, remoto]
      - title: "Qual comando eu preciso?"
        contentBlocks:
          - type: reference-card
            items:
              - "`git status` — branch, conflitos, arquivos staged e não staged."
              - "`git diff` — working tree × stage; `git diff --staged` — stage × HEAD."
              - "`git add arquivo.js` — selecionar; `git restore --staged arquivo.js` — tirar do stage."
              - "`git log --oneline -10` — commits; `git show HEAD` — último commit."
            links:
              - {
                  label: "Começar uma task ou configurar upstream",
                  doc: git-branches-remotos,
                  section: comecar-task,
                }
              - {
                  label: "Guardar alterações e trocar de contexto",
                  doc: git-stash-troca-contexto,
                }
              - {
                  label: "Trabalhar em duas tasks com worktree",
                  doc: git-worktree,
                }
              - {
                  label: "Atualizar uma branch atrasada",
                  doc: git-fetch-pull-merge-rebase,
                  section: preparar,
                }
              - {
                  label: "Resolver conflitos de merge, rebase ou cherry-pick",
                  doc: git-conflitos,
                }
              - {
                  label: "Desfazer e recuperar algo que sumiu",
                  doc: git-desfazer-recuperar,
                }
              - {
                  label: "Revisar PR/MR, corrigir e juntar commits",
                  doc: git-historico-commits,
                }
              - { label: "Marcar uma versão com tag", doc: git-tags-releases }
        tags: [consulta rápida, comandos, tirar do stage, não perder alterações]
      - title: "Clonar ou iniciar um repositório"
        description: "Para um projeto existente, clone a URL fornecida pelo time. Para um projeto novo, inicialize a pasta e conecte um remoto vazio; `origin` é um nome convencional, não um provedor."
        code: |-
          git clone https://git.example.com/equipe/projeto.git
          cd projeto
        contentBlocks:
          - type: flow-steps
            title: "Se o projeto nasceu na sua máquina"
            steps:
              - "Na pasta do projeto, rode `git init -b master`; escolha a base usada pelo time."
              - "Conecte com `git remote add origin https://git.example.com/equipe/projeto.git`."
              - "Confira com `git remote -v`. Depois de criar o primeiro commit, publique com `git push -u origin master`."
        tags:
          [clone, init, clonar, iniciar, origin, main, master, GitHub, GitLab]
      - title: "Ignorar arquivos gerados e segredos"
        description: "Conteúdo de um arquivo `.gitignore`. Ele afeta arquivos ainda não rastreados; não remove arquivos do histórico."
        codeLanguage: text
        code: |-
          node_modules/
          dist/
          .env
          *.log
        tags: [gitignore, ignored, ignorar, untracked, env]
      - title: "Parar de rastrear um arquivo"
        description: "Primeiro acrescente `.env` ao `.gitignore`. `--cached` remove do índice e mantém a cópia no seu disco; revise a remoção antes de commitar."
        code: |-
          git rm --cached .env
          git diff --staged
          git commit -m "chore: para de rastrear configuração local"
        callout:
          type: warn
          label: "Histórico continua existindo:"
          text: "Se houve segredo publicado, revogue a credencial. O comando não apaga versões antigas; a remoção pode apagar a cópia rastreada dos colegas quando eles atualizarem."
        tags: [rm --cached, gitignore, parar de rastrear, segredo]
  - id: fluxo-diario
    name: "Fluxo diário"
    entries:
      - title: "Revisar, selecionar e commitar"
        kicker: "Um commit com uma intenção"
        code: |-
          git status
          git diff
          git add src/pesquisa.js
          git diff --staged
          git commit -m "feat: adiciona pesquisa NPS"
        contentBlocks:
          - type: flow-steps
            steps:
              - "Confira a branch no `status` e leia o `diff` antes de selecionar."
              - "Use `add` para o arquivo inteiro ou `git add -p` para escolher trechos. `git add .` inclui mudanças sob a pasta atual: revise antes."
              - "Confira o stage; o commit registra essa seleção, não edições feitas depois do `add`."
        tags: [status, diff, add, stage, commit, patch, fluxo diário]
      - title: "Publicar a branch quando estiver pronto"
        description: "Na primeira publicação, `-u` configura upstream. Nas próximas, confira `git branch -vv` e use `git push`. Criar commits não obriga a fazer push."
        code: "git push -u origin SI-1234-feature/pesquisa-nps"
        tags: [push, publicar, upstream, commit local, sem push]
      - title: "Buscar novidades e integrar conscientemente"
        description: "`fetch` atualiza referências locais do remoto sem integrar na branch atual. `pull` busca e integra; a estratégia depende de opções/configuração. `--ff-only` só avança quando não há divergência."
        code: |-
          git fetch origin
          git status -sb
        contentBlocks:
          - type: reference-card
            items:
              - "`git pull --ff-only` — atualizar a branch pelo upstream sem criar um merge de histórias divergentes."
              - "Se recusar, inspecione a divergência e escolha merge ou rebase conforme o time."
            links:
              - {
                  label: "Fetch, pull, merge e rebase: escolher o fluxo",
                  doc: git-fetch-pull-merge-rebase,
                }
        tags: [fetch, pull, atualizar branch, merge, rebase]
  - id: branches
    name: "Branches"
    entries:
      - title: "Criar ou trocar de branch"
        description: "`git branch` lista branches locais. `switch -c` cria a partir de HEAD e já troca; `switch` abre uma existente. Use a receita dedicada para começar da base atualizada."
        code: |-
          git branch
          git switch -c SI-1234-feature/pesquisa-nps
        contentBlocks:
          - type: reference-card
            links:
              - {
                  label: "Branches e remotos: criar, trocar, rastrear e remover",
                  doc: git-branches-remotos,
                }
              - {
                  label: "Branch atrasada: integrar a base",
                  doc: git-fetch-pull-merge-rebase,
                  section: preparar,
                }
              - {
                  label: "Merge parou com conflito",
                  doc: git-conflitos,
                  section: merge,
                }
        tags: [branch, switch, criar task, trocar branch, checkout]
  - id: desfazer-reverter
    name: "Desfazer e reverter"
    entries:
      - title: "Fiz git add por engano"
        description: "Retira a seleção do próximo commit sem apagar o conteúdo no disco. `.` atua sob a pasta atual."
        code: |-
          git restore --staged arquivo.js
        tags: [restore, staged, tirar do stage, desfazer add, index]
      - title: "Escolha pela localização do erro"
        contentBlocks:
          - type: reference-card
            items:
              - "**Sem commit:** inspecione o diff; restore pode descartar edições."
              - "**Commit local:** amend corrige o último; reset pode mover a branch."
              - "**Já publicado:** revert cria uma compensação sem apagar o histórico."
              - "**Algo sumiu:** consulte o reflog antes de tentar outros resets."
            links:
              - {
                  label: "Desfazer, descartar e recuperar com os cuidados de cada operação",
                  doc: git-desfazer-recuperar,
                }
        tags:
          [
            desfazer commit,
            desfazer push,
            reset,
            restore,
            revert,
            reflog,
            recuperar commit,
          ]
  - id: tags-releases
    name: "Tags e releases"
    entries:
      - title: "Marcar uma versão"
        description: "Uma tag aponta para um ponto do histórico. A release do provedor pode acrescentar notas e artefatos; não é criada automaticamente por este comando."
        code: 'git tag -a v1.2.0 -m "release: v1.2.0"'
        contentBlocks:
          - type: reference-card
            links:
              - {
                  label: "Criar, inspecionar, publicar e remover tags",
                  doc: git-tags-releases,
                }
        tags: [tag, release, versão, anotada]
  - id: extras-frequentes
    name: "Pausar, recuperar e corrigir"
    entries:
      - title: "Guardar agora e retomar depois"
        description: "`git stash` guarda alterações rastreadas; `git stash pop` as reaplica e remove o stash se funcionar. Arquivos novos exigem `-u`; veja o fluxo antes de trocar de contexto."
        contentBlocks:
          - type: reference-card
            links:
              - {
                  label: "Task A → Task B → Task A com stash",
                  doc: git-stash-troca-contexto,
                  section: task-a-b,
                }
              - {
                  label: "Dois diretórios de trabalho com worktree",
                  doc: git-worktree,
                }
              - {
                  label: "Recuperar commit ou branch pelo reflog",
                  doc: git-desfazer-recuperar,
                  section: recuperar,
                }
              - {
                  label: "Corrigir o último commit com amend",
                  doc: git-historico-commits,
                  section: amend,
                }
        tags: [stash, guardar alterações, worktree, reflog, amend, recuperar]
