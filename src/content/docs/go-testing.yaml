id: go-testing
title: "Go: Testes"
subtitle: Guia prático para o pacote testing, testes table-driven, t.Helper, filtro -run e servidor HTTP de teste com httptest.
searchPlaceholder: Buscar go test, Test, t.Run, httptest ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Primeiro teste
  kicker: Arquivo *_test.go
  description: "Testes ficam no mesmo pacote (ou `package xxx_test` para testes externos). O nome da função começa por `Test` e recebe `*testing.T`. Para falhas modeladas com `error`, veja `Go: Erros` no hub."
  steps:
    - Módulo com `go mod init exemplo.local/demo`.
    - Crie `sum.go` e `sum_test.go` conforme o exemplo abaixo.
    - Execute `go test -v .` na pasta do módulo.
  codeLanguage: shell
  code: |-
    go mod init exemplo.local/demo
    go test -v .
  callout:
    type: hint
    label: "Documentação relacionada:"
    text: "`go test` compila e executa binários temporários; imports seguem o mesmo módulo que em `Go: Módulos`."
sections:
  - id: basico-testing
    name: Pacote testing
    layout: single
    entries:
      - title: TestSum e go test
        kicker: Asserções com Errorf
        description: "`testing.T` oferece `Errorf`, `Fatalf`, `FailNow`, `Helper`, entre outros. `Fatalf` aborta o teste atual; `Errorf` acumula falha e continua."
        descriptionTone: default
        code: |-
          // sum.go
          package demo

          func Sum(a, b int) int {
          	return a + b
          }

          // sum_test.go
          package demo

          import "testing"

          func TestSum(t *testing.T) {
          	if got := Sum(2, 3); got != 5 {
          		t.Errorf("Sum(2,3) = %d; want 5", got)
          	}
          }
        codeLanguage: go
        tags:
          - go
          - testing
          - Test
          - Errorf
          - go test
      - title: t.Run para subtestes
        kicker: Organizar cenários
        description: '`t.Run("nome", func(t *testing.T){ ... })` cria subtestes com nomes próprios no `-v` e permite filtrar com `-run TestSum/positivo`.'
        descriptionTone: default
        code: |-
          // sum_test.go (adicione ao mesmo pacote)
          package demo

          import "testing"

          func TestSumSub(t *testing.T) {
          	t.Run("zeros", func(t *testing.T) {
          		if Sum(0, 0) != 0 {
          			t.Fatal("unexpected")
          		}
          	})
          }
        codeLanguage: go
        tags:
          - go
          - t.Run
          - subtest
          - testing
  - id: table-driven
    name: Table-driven tests
    layout: single
    entries:
      - title: Slice de casos e loop
        kicker: Padrão idiomático
        description: Define-se uma struct de caso com entrada e resultado esperado; o loop chama `t.Run` ou usa `t.Errorf` com contexto do caso.
        descriptionTone: default
        code: |-
          package demo

          import "testing"

          func TestAbsTable(t *testing.T) {
          	cases := []struct {
          		in, want int
          	}{
          		{1, 1},
          		{-3, 3},
          		{0, 0},
          	}
          	for _, c := range cases {
          		if got := abs(c.in); got != c.want {
          			t.Errorf("abs(%d)=%d want %d", c.in, got, c.want)
          		}
          	}
          }

          func abs(x int) int {
          	if x < 0 {
          		return -x
          	}
          	return x
          }
        codeLanguage: go
        tags:
          - go
          - table test
          - testing
          - cases
      - title: Filtro com -run
        kicker: Regex sobre nome do teste
        description: "`go test -run TestAbsTable/zeros` não aplica aqui sem subtests nomeados, mas `-run TestAbsTable` limita execução a esse teste. Útil em suites grandes."
        descriptionTone: default
        code: go test -v -run TestAbsTable ./...
        codeLanguage: shell
        tags:
          - go
          - go test
          - -run
          - regex
  - id: helper-httptest
    name: t.Helper e httptest
    layout: single
    entries:
      - title: t.Helper para linhas úteis nas falhas
        kicker: Funções de apoio
        description: Marque helpers com `t.Helper()` no início; o relatório de falha aponta para a linha do chamador em vez da linha dentro do helper.
        descriptionTone: default
        code: |-
          package demo

          import "testing"

          func assertEq(t *testing.T, got, want int) {
          	t.Helper()
          	if got != want {
          		t.Fatalf("got %d want %d", got, want)
          	}
          }

          func TestWithHelper(t *testing.T) {
          	assertEq(t, 1+1, 2)
          }
        codeLanguage: go
        tags:
          - go
          - t.Helper
          - testing
          - stack
      - title: httptest.Server para handlers HTTP
        kicker: Cliente contra servidor local
        description: "`httptest.NewServer` inicia um `http.Server` com listener em porta efêmera. Use `defer srv.Close()` e `srv.URL` em `http.Get`. Combine com `Go: JSON` quando o handler retorna JSON."
        descriptionTone: default
        code: |
          package demo

          import (
          	"io"
          	"net/http"
          	"net/http/httptest"
          	"testing"
          )

          func TestPing(t *testing.T) {
          	h := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          		w.WriteHeader(http.StatusOK)
          		_, _ = io.WriteString(w, "pong")
          	})
          	srv := httptest.NewServer(h)
          	t.Cleanup(srv.Close)

          	resp, err := http.Get(srv.URL)
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer resp.Body.Close()
          	if resp.StatusCode != http.StatusOK {
          		t.Fatalf("status %d", resp.StatusCode)
          	}
          }
        codeLanguage: go
        tags:
          - go
          - httptest
          - http
          - testing
          - Server
        callout:
          type: hint
          label: "Go 1.14+:"
          text: "`t.Cleanup` registra funções que rodam ao fim do teste (substitui muitos `defer` manuais)."
  - id: decisao-rapida
    name: Decisão Rápida
    layout: single
    entries:
      - title: Atalho mental para escrever testes em Go
        kicker: T.Errorf, table-driven e httptest
        description: Use este resumo para decidir a forma do teste sem inflar a suíte com repetição.
        descriptionTone: default
        contentBlocks:
          - type: reference-card
            title: Mapa de decisão
            items:
              - "Nome de função começando com `Test` + `*testing.T` para todo teste."
              - "`t.Errorf` acumula falha e continua; `t.Fatalf` aborta o teste atual."
              - "Table-driven test quando a mesma regra precisa de vários casos de entrada."
              - "`t.Run` para nomear subtestes e poder filtrar com `-run`."
              - "`t.Helper()` em função de apoio para apontar a falha na linha certa."
              - "`httptest.NewServer` para testar handler HTTP sem porta fixa."
          - type: context-block
            title: Armadilha comum
            variant: common-error
            label: "Cuidado:"
            text: esquecer `t.Cleanup` ou `defer` para fechar servidor de teste. Servidor de teste que não fecha vaza porta e handle entre execuções, e pode deixar a suíte instável em CI.
        tags:
          - go
          - testing
          - decisao
          - boas-praticas
