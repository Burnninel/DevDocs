id: php-orientacao-objetos
title: "PHP: Orientação a Objetos"
subtitle: Guia prático para entender, criar e aplicar orientação a objetos em PHP com exemplos que ajudam no código do dia a dia.
searchPlaceholder: Buscar classe, método, interface ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: php
defaultSectionLayout: single
quickStart:
  title: Como testar os exemplos desta documentação
  kicker: Requisitos e execução no terminal
  description: Os exemplos foram pensados para rodar direto no terminal, sem framework e sem setup extra além do PHP CLI.
  steps:
    - Verifique se o PHP está instalado com `php --version`.
    - Prefira usar PHP 8.1 ou superior para rodar todos os exemplos desta página.
    - Crie um arquivo, por exemplo `oop.php`, e cole um exemplo desta página.
    - Execute no terminal com `php oop.php`.
  codeLanguage: shell
  code: |-
    php --version
    php oop.php
  callout:
    type: hint
    label: "Dica:"
    text: alguns exemplos usam recursos modernos do PHP, então trabalhar com `PHP 8.1+` evita erro de sintaxe e deixa a leitura mais próxima de projetos atuais.
sections:
  - id: base
    name: Base
    layout: single
    entries:
      - title: Conceito de orientação a objetos
        kicker: Modelar sistema como objetos com dados e comportamento
        description: Em vez de espalhar dados e funções soltas, OO agrupa tudo em objetos que representam algo do sistema, como produto, pedido, cliente ou serviço.
        descriptionTone: default
        code: |-
          <?php
          class Produto
          {
              public string $nome;
              public float $preco;

              public function resumo(): string
              {
                  return "{$this->nome} - R$ {$this->preco}";
              }
          }

          $produto = new Produto();
          $produto->nome = "Teclado Mecânico";
          $produto->preco = 299.90;

          echo $produto->resumo() . PHP_EOL;
        output: |-
          Teclado Mecânico - R$ 299.9
        tags:
          - php
          - oop
          - conceito
          - objeto
          - classe
          - base
      - title: Definição de classes
        kicker: Classe é o molde, objeto é a instância
        description: A classe descreve como o objeto deve ser montado. Depois disso, cada `new` cria uma instância com seu próprio estado e seus próprios valores.
        descriptionTone: default
        code: |-
          <?php
          class Usuario
          {
              public string $nome = "";

              public function apresentar(): string
              {
                  return "Olá, eu sou {$this->nome}";
              }
          }

          $ana = new Usuario();
          $ana->nome = "Ana";

          $bruno = new Usuario();
          $bruno->nome = "Bruno";

          echo $ana->apresentar() . PHP_EOL;
          echo $bruno->apresentar() . PHP_EOL;
        output: |-
          Olá, eu sou Ana
          Olá, eu sou Bruno
        tags:
          - php
          - classe
          - instancia
          - new
          - objeto
          - definicao
      - title: Instância, new e $this
        kicker: Entender os símbolos que aparecem em quase todo exemplo
        description: "`new` cria um objeto novo na memória e `$this` é a forma de a própria classe acessar seus dados e métodos internamente. Esses dois elementos aparecem o tempo todo em OO."
        descriptionTone: default
        code: |-
          <?php
          class Saudacao
          {
              public string $nome = "";

              public function definirNome(string $nome): void
              {
                  $this->nome = $nome;
              }

              public function mensagem(): string
              {
                  return "Olá, {$this->nome}";
              }
          }

          $saudacao = new Saudacao();
          $saudacao->definirNome("Camila");

          echo $saudacao->mensagem() . PHP_EOL;
        output: Olá, Camila
        tags:
          - php
          - instancia
          - new
          - this
          - objeto
          - base
        callout:
          type: hint
          label: "Leitura rápida:"
          text: fora da classe você acessa o objeto pela variável; dentro da classe você acessa esse mesmo objeto com `$this`.
      - title: Propriedades
        kicker: Dados internos da classe
        description: Propriedades guardam o estado do objeto. Quando você tipa essas propriedades, fica mais claro que tipo de dado cada classe espera armazenar.
        descriptionTone: default
        code: |-
          <?php
          class Conta
          {
              public string $titular; // visível fora da classe
              private float $saldo = 0.0; // só métodos desta classe alteram

              public function depositar(float $valor): void
              {
                  $this->saldo += $valor;
              }

              public function getSaldo(): float
              {
                  return $this->saldo;
              }
          }

          $conta = new Conta();
          $conta->titular = "Carla";
          $conta->depositar(500);

          echo $conta->titular . " -> R$ " . number_format($conta->getSaldo(), 2, ",", ".") . PHP_EOL;
        output: Carla -> R$ 500,00
        tags:
          - php
          - propriedades
          - tipagem
          - estado
          - atributos
          - oop
      - title: Métodos
        kicker: Regra de negócio dentro da classe
        description: Métodos são as ações do objeto. Em vez de manipular os dados da classe por fora, você coloca a regra dentro dela e deixa o comportamento mais previsível.
        descriptionTone: default
        code: |-
          <?php
          class Carrinho
          {
              private array $itens = [];

              // $nome/$preco: dados do produto na linha do carrinho
              public function adicionarItem(string $nome, float $preco): void
              {
                  $this->itens[] = ["nome" => $nome, "preco" => $preco];
              }

              public function total(): float
              {
                  $soma = 0;

                  foreach ($this->itens as $item) {
                      $soma += $item["preco"];
                  }

                  return $soma;
              }
          }

          $carrinho = new Carrinho();
          $carrinho->adicionarItem("Mouse", 120);
          $carrinho->adicionarItem("Teclado", 220);

          echo "Total: R$ " . number_format($carrinho->total(), 2, ",", ".") . PHP_EOL;
        output: "Total: R$ 340,00"
        tags:
          - php
          - metodos
          - regra-negocio
          - classe
          - carrinho
          - oop
      - title: Constructor (__construct)
        kicker: Inicializar objeto com dados obrigatórios
        description: O construtor executa assim que o objeto é criado. Ele é útil para garantir que a classe já nasça com os dados mínimos necessários para funcionar.
        descriptionTone: default
        code: |-
          <?php
          class ConexaoApi
          {
              private string $baseUrl;
              private string $token;

              // $baseUrl: URL base; $token: credencial de autenticação
              public function __construct(string $baseUrl, string $token)
              {
                  $this->baseUrl = $baseUrl;
                  $this->token = $token;
              }

              public function resumo(): string
              {
                  return "API: {$this->baseUrl} (token configurado)";
              }
          }

          $conexao = new ConexaoApi("https://api.empresa.com", "token-123");
          echo $conexao->resumo() . PHP_EOL;
        output: "API: https://api.empresa.com (token configurado)"
        tags:
          - php
          - constructor
          - __construct
          - inicializacao
          - new
          - oop
      - title: Constructor promotion (atalho útil)
        kicker: Declarar e preencher atributos no mesmo lugar
        description: Constructor promotion reduz repetição quando a classe só precisa receber e guardar alguns dados. Em vez de declarar a propriedade em cima e atribuir no corpo do construtor, você faz isso direto na assinatura.
        descriptionTone: default
        code: |-
          <?php
          class Cliente
          {
              public function __construct(
                  public string $nome,
                  public string $email // promotion: cria propriedades a partir destes parâmetros
              ) {}

              public function contato(): string
              {
                  return "{$this->nome} <{$this->email}>";
              }
          }

          $cliente = new Cliente("João", "joao@email.com");
          echo $cliente->contato() . PHP_EOL;
        output: João <joao@email.com>
        tags:
          - php
          - constructor-promotion
          - atributos
          - boilerplate
          - classe
          - oop
        callout:
          type: hint
          label: "Dica:"
          text: esse formato funciona muito bem quando a classe recebe poucos dados e não precisa de lógica extra no construtor.
      - title: De classes em arquivo único para Composer e PSR-4
        kicker: Namespaces ganham escala com autoload
        description: "Nesta documentação os exemplos cabem num só arquivo para leitura rápida. Em projetos reais você divide `src/` por namespace, adiciona `autoload.psr-4` no `composer.json` e carrega tudo com `vendor/autoload.php`. No hub, siga `PHP: Composer e autoload` para `composer require`, `dump-autoload` e o mapeamento exato entre namespace e caminho de pastas."
        descriptionTone: default
        code: |-
          <?php
          // composer.json (trecho ilustrativo)
          // "autoload": { "psr-4": { "App\\": "src/" } }

          // src/Modelo/Pedido.php em projeto real:
          // namespace App\Modelo;
          // final class Pedido { ... }

          // public/index.php
          declare(strict_types=1);
          require __DIR__ . "/../vendor/autoload.php";

          echo "Pronto: classes em src/ carregadas pelo Composer." . PHP_EOL;
        output: "Pronto: classes em src/ carregadas pelo Composer."
        tags:
          - php
          - composer
          - psr-4
          - autoload
          - namespace
          - projeto
        callout:
          type: hint
          label: "Próximo passo:"
          text: configure o `composer.json`, rode `composer install` e mantenha o nome da classe igual ao nome do arquivo `.php`.
  - id: encapsulamento
    name: Encapsulamento
    layout: single
    entries:
      - title: Encapsulamento (public, private, protected)
        kicker: Controlar acesso ao estado da classe
        description: Encapsular é decidir o que pode ser acessado de fora e o que deve ficar protegido dentro da classe. Isso evita alteração indevida e concentra a regra no lugar certo.
        descriptionTone: default
        code: |-
          <?php
          class ContaBancaria
          {
              public string $titular; // public: acesso liberado fora da classe
              private float $saldo = 0; // private: so a propria classe acessa direto

              public function __construct(string $titular)
              {
                  $this->titular = $titular;
              }

              public function depositar(float $valor): void
              {
                  if ($valor > 0) {
                      $this->saldo += $valor;
                  }
              }

              protected function podeSacar(float $valor): bool // protected: a propria classe e as filhas podem usar
              {
                  return $valor > 0 && $valor <= $this->saldo;
              }

              public function sacar(float $valor): void
              {
                  if ($this->podeSacar($valor)) {
                      $this->saldo -= $valor;
                  }
              }

              public function getSaldo(): float
              {
                  return $this->saldo;
              }
          }

          $conta = new ContaBancaria("Marina");
          $conta->depositar(300);
          $conta->sacar(120);

          echo "Saldo final: R$ " . $conta->getSaldo() . PHP_EOL;
        output: "Saldo final: R$ 180"
        tags:
          - php
          - encapsulamento
          - public
          - private
          - protected
          - oop
      - title: Getters e setters com validação
        kicker: Evitar estado inválido no objeto
        description: Getter e setter fazem sentido quando a classe precisa controlar leitura ou escrita. O ganho real aparece quando você valida, transforma ou protege dados antes de salvar.
        descriptionTone: default
        code: |-
          <?php
          class ProdutoEstoque
          {
              private int $quantidade = 0;

              public function setQuantidade(int $quantidade): void
              {
                  if ($quantidade < 0) { // rejeita estado inválido antes de gravar
                      throw new InvalidArgumentException("Quantidade não pode ser negativa");
                  }

                  $this->quantidade = $quantidade;
              }

              public function getQuantidade(): int
              {
                  return $this->quantidade;
              }
          }

          $estoque = new ProdutoEstoque();
          $estoque->setQuantidade(15);

          echo "Quantidade: " . $estoque->getQuantidade() . PHP_EOL;
        output: "Quantidade: 15"
        tags:
          - php
          - getter
          - setter
          - validacao
          - estado
          - encapsulamento
        callout:
          type: warn
          label: "Atenção:"
          text: getter e setter não são obrigatórios por padrão. Use quando eles realmente ajudam a proteger regra, validar dados ou esconder detalhes internos.
      - title: readonly para dados imutáveis
        kicker: Travar valor depois da criação
        description: "`readonly` serve para valores que podem ser definidos na criação, mas não devem ser alterados depois, como id, data de criação ou chave externa."
        descriptionTone: default
        code: |-
          <?php
          class PedidoId
          {
              public function __construct(
                  public readonly string $valor // definido no new; não pode ser alterado depois
              ) {}
          }

          $pedidoId = new PedidoId("PED-2026-0001");
          echo $pedidoId->valor . PHP_EOL;

          // $pedidoId->valor = "PED-2026-0002"; // erro: readonly bloqueia alteração após a criação
        output: PED-2026-0001
        tags:
          - php
          - readonly
          - imutavel
          - id
          - propriedade
          - encapsulamento
      - title: const e static em regras compartilhadas
        kicker: Quando o valor não depende da instância
        description: Use `const` para valores fixos da classe e `static` para comportamentos que fazem sentido no contexto da classe, mas não precisam de um objeto específico.
        descriptionTone: default
        code: |-
          <?php
          class Frete
          {
              public const VALOR_MINIMO_GRATIS = 250.00;

              public static function calcular(float $subtotal): float
              {
                  if ($subtotal >= self::VALOR_MINIMO_GRATIS) {
                      return 0;
                  }

                  return 19.90;
              }
          }

          echo "Frete 120: R$ " . number_format(Frete::calcular(120), 2, ",", ".") . PHP_EOL;
          echo "Frete 300: R$ " . number_format(Frete::calcular(300), 2, ",", ".") . PHP_EOL;
        output: |-
          Frete 120: R$ 19,90
          Frete 300: R$ 0,00
        tags:
          - php
          - const
          - static
          - regra-negocio
          - frete
          - classe
  - id: heranca-polimorfismo
    name: Herança e Polimorfismo
    layout: single
    entries:
      - title: Herança (extends)
        kicker: Especializar comportamento da classe base
        description: Herança permite criar uma classe nova a partir de outra que já existe. A classe filha reaproveita estrutura da classe pai e altera apenas o que for específico.
        descriptionTone: default
        code: |-
          <?php
          class Funcionario
          {
              public function __construct(protected string $nome) {} // visível na subclasse (filha)

              public function cargo(): string
              {
                  return "Funcionário";
              }

              public function resumo(): string
              {
                  return $this->nome . " - " . $this->cargo();
              }
          }

          class Gerente extends Funcionario
          {
              public function cargo(): string
              {
                  return "Gerente"; // sobrescreve o método da classe pai
              }
          }

          $gerente = new Gerente("Diego");
          echo $gerente->resumo() . PHP_EOL;
        output: Diego - Gerente
        tags:
          - php
          - heranca
          - extends
          - classe-pai
          - classe-filha
          - oop
      - title: "Sobrescrita de método com parent::"
        kicker: Reaproveitar lógica base sem duplicar código
        description: Quando a regra da classe pai quase serve, mas precisa de um complemento, `parent::` ajuda a reaproveitar a base antes de adicionar o comportamento novo.
        descriptionTone: default
        code: |-
          <?php
          class PlanoBasico
          {
              public function recursos(): array
              {
                  return ["dashboard", "suporte-email"];
              }
          }

          class PlanoPro extends PlanoBasico
          {
              public function recursos(): array
              {
                  $base = parent::recursos(); // reutiliza o método da classe pai
                  $base[] = "relatorios-avancados";
                  $base[] = "suporte-prioritario";

                  return $base;
              }
          }

          $plano = new PlanoPro();
          print_r($plano->recursos());
        output: |-
          Array
          (
              [0] => dashboard
              [1] => suporte-email
              [2] => relatorios-avancados
              [3] => suporte-prioritario
          )
        tags:
          - php
          - override
          - parent
          - heranca
          - reuso
          - oop
      - title: "self:: e parent:: na prática"
        kicker: Saber quando acessar a própria classe ou a classe pai
        description: "`self::` referencia a própria classe atual. `parent::` referencia a classe pai. Essa diferença é útil quando a classe filha precisa usar parte da base herdada e também sua própria definição."
        descriptionTone: default
        code: |-
          <?php
          class PlanoBasico
          {
              protected const LIMITE_USUARIOS = 3;
          }

          class PlanoPro extends PlanoBasico
          {
              protected const LIMITE_USUARIOS = 10;

              public function limiteDoPai(): int
              {
                  return parent::LIMITE_USUARIOS; // parent:: acessa o membro da classe pai
              }

              public function limiteAtual(): int
              {
                  return self::LIMITE_USUARIOS; // self:: acessa o membro da classe atual
              }
          }

          $plano = new PlanoPro();

          echo "Pai: " . $plano->limiteDoPai() . PHP_EOL;
          echo "Atual: " . $plano->limiteAtual() . PHP_EOL;
        output: |-
          Pai: 3
          Atual: 10
        tags:
          - php
          - self
          - parent
          - heranca
          - classe-pai
          - classe-filha
      - title: Polimorfismo com interface
        kicker: Trocar implementação sem mudar o uso
        description: Polimorfismo aparece quando partes diferentes do sistema seguem o mesmo contrato. Assim, quem usa a interface troca a implementação sem precisar reescrever o fluxo.
        descriptionTone: default
        code: |-
          <?php
          interface GatewayPagamento
          {
              public function pagar(float $valor): string;
          }

          class PixGateway implements GatewayPagamento
          {
              public function pagar(float $valor): string
              {
                  return "PIX aprovado: R$ {$valor}";
              }
          }

          class CartaoGateway implements GatewayPagamento
          {
              public function pagar(float $valor): string
              {
                  return "Cartão aprovado: R$ {$valor}";
              }
          }

          // $gateway: implementação concreta; $valor: total da compra
          function finalizarCompra(GatewayPagamento $gateway, float $valor): void
          {
              echo $gateway->pagar($valor) . PHP_EOL;
          }

          finalizarCompra(new PixGateway(), 150);
          finalizarCompra(new CartaoGateway(), 150);
        output: |-
          PIX aprovado: R$ 150
          Cartão aprovado: R$ 150
        tags:
          - php
          - polimorfismo
          - interface
          - gateway
          - pagamento
          - oop
      - title: Polimorfismo com classe abstrata
        kicker: Padronizar fluxo e variar só os detalhes
        description: Classe abstrata é útil quando existe um fluxo base que deve ser reaproveitado, mas uma ou mais etapas precisam mudar em cada classe filha.
        descriptionTone: default
        code: |-
          <?php
          abstract class Exportador
          {
              public function exportar(array $dados): string
              {
                  $dadosNormalizados = $this->normalizar($dados);
                  return $this->formatar($dadosNormalizados); // cada filha define o formato
              }

              protected function normalizar(array $dados): array
              {
                  return array_map("trim", $dados);
              }

              abstract protected function formatar(array $dados): string;
          }

          class ExportadorCsv extends Exportador
          {
              protected function formatar(array $dados): string
              {
                  return implode(",", $dados);
              }
          }

          class ExportadorJson extends Exportador
          {
              protected function formatar(array $dados): string
              {
                  return json_encode($dados, JSON_UNESCAPED_UNICODE);
              }
          }

          $csv = new ExportadorCsv();
          $json = new ExportadorJson();

          echo $csv->exportar([" Ana ", "Bruno "]) . PHP_EOL;
          echo $json->exportar([" Ana ", "Bruno "]) . PHP_EOL;
        output: |-
          Ana,Bruno
          ["Ana","Bruno"]
        tags:
          - php
          - polimorfismo
          - classe-abstrata
          - template-method
          - exportacao
          - oop
      - title: Trait para reaproveitar comportamento pequeno
        kicker: Reuso horizontal sem herança profunda
        description: "`trait` permite compartilhar métodos pequenos entre classes diferentes sem obrigar uma relação de pai e filha. É uma boa saída para utilidades curtas e bem isoladas."
        descriptionTone: default
        code: |-
          <?php
          trait GeraSlug
          {
              public function slug(string $texto): string
              {
                  return strtolower(str_replace(" ", "-", trim($texto)));
              }
          }

          class Categoria
          {
              use GeraSlug; // inclui o método slug nesta classe
          }

          class Produto
          {
              use GeraSlug;
          }

          $categoria = new Categoria();
          $produto = new Produto();

          echo $categoria->slug("Casa e Escritório") . PHP_EOL;
          echo $produto->slug("Mouse Gamer RGB") . PHP_EOL;
        output: |-
          casa-e-escritório
          mouse-gamer-rgb
        tags:
          - php
          - trait
          - reuso
          - comportamento
          - heranca
          - oop
        callout:
          type: hint
          label: "Quando usar:"
          text: trait ajuda quando o reaproveitamento é pequeno e objetivo. Se a regra ficar grande demais, costuma ser melhor modelar uma classe própria.
  - id: exemplos-praticos-reais
    name: Exemplos Práticos Reais
    layout: single
    entries:
      - title: Pedido com itens e cupom
        kicker: Cenário real de e-commerce
        description: "Esse exemplo mostra OO resolvendo um caso real: cada classe cuida de uma parte do problema e a regra de preço fica mais clara para manter e expandir."
        descriptionTone: default
        code: |-
          <?php
          class ItemPedido
          {
              public function __construct(
                  public string $nome,
                  public float $preco,
                  public int $quantidade
              ) {}

              public function subtotal(): float
              {
                  return $this->preco * $this->quantidade;
              }
          }

          class Cupom
          {
              public function __construct(private float $desconto) {}

              public function aplicar(float $valor): float
              {
                  return max(0, $valor - $this->desconto);
              }
          }

          class Pedido
          {
              private array $itens = [];

              public function adicionarItem(ItemPedido $item): void
              {
                  $this->itens[] = $item;
              }

              public function total(?Cupom $cupom = null): float
              {
                  $soma = 0;

                  foreach ($this->itens as $item) {
                      $soma += $item->subtotal();
                  }

                  if ($cupom === null) {
                      return $soma;
                  }

                  return $cupom->aplicar($soma);
              }
          }

          $pedido = new Pedido();
          $pedido->adicionarItem(new ItemPedido("Notebook", 3500, 1));
          $pedido->adicionarItem(new ItemPedido("Mouse", 120, 2));

          $cupom = new Cupom(150);
          echo "Total final: R$ " . number_format($pedido->total($cupom), 2, ",", ".") . PHP_EOL;
        output: "Total final: R$ 3.590,00"
        tags:
          - php
          - exemplo-pratico
          - pedido
          - cupom
          - ecommerce
          - oop
      - title: Pagamento com múltiplos gateways
        kicker: Troca de provedor sem quebrar o fluxo
        description: Aqui o serviço não depende de Pix nem de cartão diretamente. Ele depende do contrato, o que facilita troca de provedor e testes.
        descriptionTone: default
        code: |-
          <?php
          interface Gateway
          {
              public function cobrar(float $valor): bool;
          }

          class GatewayPix implements Gateway
          {
              public function cobrar(float $valor): bool
              {
                  echo "Cobrança Pix: R$ " . number_format($valor, 2, ",", ".") . PHP_EOL;
                  return true;
              }
          }

          class GatewayCartao implements Gateway
          {
              public function cobrar(float $valor): bool
              {
                  echo "Cobrança Cartão: R$ " . number_format($valor, 2, ",", ".") . PHP_EOL;
                  return true;
              }
          }

          class CheckoutService
          {
              // $gateway: implementação concreta (Pix, cartão, etc.)
              public function __construct(private Gateway $gateway) {}

              public function finalizar(float $total): void
              {
                  $ok = $this->gateway->cobrar($total);
                  echo $ok ? "Pedido aprovado" . PHP_EOL : "Pedido recusado" . PHP_EOL;
              }
          }

          (new CheckoutService(new GatewayPix()))->finalizar(499.90);
          (new CheckoutService(new GatewayCartao()))->finalizar(499.90);
        output: |-
          Cobrança Pix: R$ 499,90
          Pedido aprovado
          Cobrança Cartão: R$ 499,90
          Pedido aprovado
        tags:
          - php
          - pagamento
          - gateway
          - interface
          - checkout
          - oop
      - title: Notificação por canal (email e SMS)
        kicker: Mesmo fluxo com implementações diferentes
        description: "Esse é um caso clássico de polimorfismo: a regra de aviso continua a mesma, mas o canal muda sem bagunçar quem chama o serviço."
        descriptionTone: default
        code: |-
          <?php
          interface Notificador
          {
              public function enviar(string $mensagem): void;
          }

          class NotificadorEmail implements Notificador
          {
              public function enviar(string $mensagem): void
              {
                  echo "Email enviado: {$mensagem}" . PHP_EOL;
              }
          }

          class NotificadorSms implements Notificador
          {
              public function enviar(string $mensagem): void
              {
                  echo "SMS enviado: {$mensagem}" . PHP_EOL;
              }
          }

          class AlertaService
          {
              // $notificador: canal concreto (email, SMS, etc.)
              public function __construct(private Notificador $notificador) {}

              public function avisarAtrasoPedido(string $pedidoId): void
              {
                  $mensagem = "Pedido {$pedidoId} está em rota";
                  $this->notificador->enviar($mensagem);
              }
          }

          (new AlertaService(new NotificadorEmail()))->avisarAtrasoPedido("PED-10");
          (new AlertaService(new NotificadorSms()))->avisarAtrasoPedido("PED-10");
        output: |-
          Email enviado: Pedido PED-10 está em rota
          SMS enviado: Pedido PED-10 está em rota
        tags:
          - php
          - notificacao
          - polimorfismo
          - email
          - sms
          - oop
      - title: Serviço de usuários com repositório tipado
        kicker: Separar regra de negócio de persistência
        description: A classe de serviço cuida da regra de cadastro e o repositório cuida de salvar os dados. Como ambos trabalham com um objeto `Usuario`, o fluxo fica mais coeso e mais orientado a objetos.
        descriptionTone: default
        code: |-
          <?php
          class Usuario
          {
              public function __construct(
                  public string $nome,
                  public string $email
              ) {}

              public function resumo(): string
              {
                  return "{$this->nome} <{$this->email}>";
              }
          }

          interface UsuarioRepository
          {
              public function salvar(Usuario $usuario): void;
              public function listar(): array;
          }

          class UsuarioRepositoryMemoria implements UsuarioRepository
          {
              private array $dados = [];

              public function salvar(Usuario $usuario): void
              {
                  $this->dados[] = $usuario;
              }

              public function listar(): array
              {
                  return $this->dados;
              }
          }

          class CadastroUsuarioService
          {
              // $repository: persistência atrás do contrato (memória, BD, etc.)
              public function __construct(private UsuarioRepository $repository) {}

              public function cadastrar(string $nome, string $email): void
              {
                  $usuario = new Usuario($nome, strtolower($email));
                  $this->repository->salvar($usuario);
              }
          }

          $repo = new UsuarioRepositoryMemoria();
          $service = new CadastroUsuarioService($repo);

          $service->cadastrar("Ana", "ANA@EMAIL.COM");
          $service->cadastrar("Bruno", "bruno@email.com");

          foreach ($repo->listar() as $usuario) {
              echo $usuario->resumo() . PHP_EOL;
          }
        output: |-
          Ana <ana@email.com>
          Bruno <bruno@email.com>
        tags:
          - php
          - repository
          - service
          - objeto
          - usuarios
          - persistencia
          - oop
  - id: boas-praticas
    name: Boas Práticas
    layout: single
    entries:
      - title: Boas práticas essenciais de OO em PHP
        kicker: Código mais limpo, testável e sustentável
        description: Na prática, boas práticas de OO servem para reduzir acoplamento, facilitar testes e deixar a intenção da classe mais clara para quem mantém o código depois.
        descriptionTone: default
        code: |-
          <?php
          interface GeradorRelatorio
          {
              public function gerar(array $dados): string;
          }

          class RelatorioCsv implements GeradorRelatorio
          {
              public function gerar(array $dados): string
              {
                  return implode(",", $dados);
              }
          }

          class RelatorioService
          {
              // $gerador: estratégia de saída (CSV, PDF, etc.) via contrato
              public function __construct(private GeradorRelatorio $gerador) {}

              public function exportar(array $dados): void
              {
                  $conteudo = $this->gerador->gerar($dados);
                  echo $conteudo . PHP_EOL;
              }
          }

          $service = new RelatorioService(new RelatorioCsv());
          $service->exportar(["id", "nome", "email"]);
        output: id,nome,email
        tags:
          - php
          - boas-praticas
          - tipagem
          - coesao
          - interface
          - oop
        callout:
          type: hint
          label: "Checklist rápido:"
          text: tipagem forte, classes com foco claro, métodos com nome objetivo, dependência por contrato e validação perto da regra de negócio.
      - title: Erros comuns e correção
        kicker: Evitar classes gigantes e alto acoplamento
        description: Um erro comum em OO é criar classes que acumulam regra, persistência, notificação e formatação ao mesmo tempo. Quando isso acontece, manter e testar fica muito mais difícil.
        descriptionTone: warn
        code: |-
          <?php
          class PedidoControllerRuim
          {
              public function calcularTotal() {} // Regra de negocio misturada aqui
              public function enviarEmail() {} // Notificacao misturada aqui
              public function salvarNoBanco() {} // Persistencia misturada aqui
              public function gerarPdf() {} // Geracao de arquivo misturada aqui
          }

          // Separacao por responsabilidade:
          class PedidoService
          {
              public function calcularTotal(): float
              {
                  return 100.0;
              }
          }

          class PedidoNotifier
          {
              public function enviarConfirmacao(): void
              {
                  echo "Email enviado" . PHP_EOL;
              }
          }

          class PedidoRepository
          {
              public function salvar(): void
              {
                  echo "Pedido salvo" . PHP_EOL;
              }
          }
        tags:
          - php
          - erros-comuns
          - responsabilidade-unica
          - acoplamento
          - refatoracao
          - oop
        callout:
          type: danger
          label: "Perigo:"
          text: quanto mais responsabilidades a mesma classe acumula, mais ela fica difícil de entender, testar e alterar com segurança.
      - title: Testabilidade com injeção de dependência
        kicker: Trocar implementação em teste sem mexer na regra
        description: Quando a classe recebe dependências por contrato, você consegue trocar a implementação real por uma fake em teste sem alterar a regra principal.
        descriptionTone: default
        code: |-
          <?php
          interface Relogio
          {
              public function agora(): DateTimeImmutable; // Contrato que permite trocar a origem da hora
          }

          class RelogioSistema implements Relogio
          {
              public function agora(): DateTimeImmutable
              {
                  return new DateTimeImmutable();
              }
          }

          class RelogioFake implements Relogio
          {
              public function agora(): DateTimeImmutable
              {
                  return new DateTimeImmutable("2026-01-01 10:00:00"); // Fake deixa o teste previsivel
              }
          }

          class SaudacaoService
          {
              public function __construct(private Relogio $relogio) {} // A classe recebe a dependencia por contrato

              public function saudacao(): string
              {
                  $hora = (int) $this->relogio->agora()->format("H");
                  return $hora < 12 ? "Bom dia" : "Boa tarde";
              }
          }

          $serviceTeste = new SaudacaoService(new RelogioFake());
          echo $serviceTeste->saudacao() . PHP_EOL;
        output: Bom dia
        tags:
          - php
          - testes
          - injecao-dependencia
          - mock
          - fake
          - oop
  - id: decisao-rapida
    name: Decisão Rápida
    layout: single
    entries:
      - title: Quando usar class, interface, abstract e trait
        kicker: Mapa mental para escolher mais rápido
        description: "Esse bloco funciona como atalho mental: ele ajuda a decidir qual ferramenta usar quando você está modelando uma solução orientada a objetos e precisa escolher a estrutura certa."
        descriptionTone: default
        contentBlocks:
          - type: reference-card
            title: Escolha rápida
            items:
              - "`interface` para contrato comum entre implementações."
              - "`abstract` para base compartilhada com parte do fluxo pronta."
              - "`trait` para reuso pequeno e horizontal."
              - "`class` para comportamento concreto que será instanciado de verdade."
        tags:
          - php
          - decisao
          - interface
          - abstract
          - trait
          - class
        callout:
          type: hint
          label: "Atalho mental:"
          text: use `interface` para contrato, `abstract` para base compartilhada, `trait` para reuso pequeno e `class` para comportamento concreto que será realmente instanciado.
tech: php
