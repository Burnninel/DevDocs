id: go-context
title: "Go: Context"
subtitle: "Guia prático para context.Context: cancelamento, prazos, valores e ligação a pedidos HTTP e trabalho em background."
searchPlaceholder: Buscar WithCancel, WithTimeout, Deadline, Done ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Prazo curto com WithTimeout
  kicker: Cancelar trabalho a meio
  description: "`context.Context` propaga cancelamento e deadlines por uma árvore de chamadas. Em HTTP, prefira sempre `r.Context()` ao criar contextos novos sem necessidade (ver `Go: HTTP` no hub)."
  steps:
    - "Módulo com `go mod init` (ver `Go: Módulos`)."
    - Cole o exemplo em `main.go` e execute `go run .`.
  codeLanguage: go
  code: |-
    package main

    import (
    	"context"
    	"fmt"
    	"time"
    )

    func main() {
    	ctx, cancel := context.WithTimeout(context.Background(), time.Millisecond)
    	defer cancel()
    	<-ctx.Done()
    	fmt.Println(ctx.Err())
    }
  output: context deadline exceeded
  callout:
    type: hint
    label: "Documentação relacionada:"
    text: "goroutines longas devem respeitar `ctx.Done()`; veja `Go: Concorrência` no hub."
sections:
  - id: background-cancel
    name: Background, cancelamento e prazos
    layout: single
    entries:
      - title: Background e TODO
        kicker: Raiz da árvore
        description: "`context.Background()` devolve um contexto vazio sem deadline, usado em `main`, init e testes de topo. `context.TODO()` sinaliza que ainda não sabes qual contexto propagar — evite deixar `TODO` permanente."
        descriptionTone: default
        code: |-
          package main

          import (
          	"context"
          	"fmt"
          )

          func main() {
          	ctx := context.Background()
          	fmt.Println(ctx.Err())
          }
        output: <nil>
        tags:
          - go
          - context
          - Background
          - TODO
          - raiz
      - title: WithCancel e propagação
        kicker: Cancelar filhos
        description: Chamar a função `cancel()` devolve `ctx.Done()` fechado a todos os descendentes criados com `WithCancel`, `WithTimeout` ou `WithDeadline` a partir desse nó.
        descriptionTone: default
        code: |-
          package main

          import (
          	"context"
          	"fmt"
          )

          func main() {
          	ctx, cancel := context.WithCancel(context.Background())
          	cancel()
          	<-ctx.Done()
          	fmt.Println(ctx.Err())
          }
        output: context canceled
        tags:
          - go
          - context
          - WithCancel
          - Done
          - cancel
  - id: valores-context
    name: WithValue e armadilhas
    layout: single
    entries:
      - title: WithValue para dados de pedido
        kicker: Chaves não exportadas
        description: Use tipos privados como chaves (`type ctxKey struct{}`) para evitar colisões entre pacotes. Valores devem ser imutáveis ou cópias defensivas — não coloques ponteiros mutáveis partilhados como valor de contexto.
        descriptionTone: warn
        code: |-
          package main

          import (
          	"context"
          	"fmt"
          )

          type ctxKeyUser struct{}

          func main() {
          	ctx := context.WithValue(context.Background(), ctxKeyUser{}, "Ana")
          	fmt.Println(ctx.Value(ctxKeyUser{}))
          }
        output: Ana
        tags:
          - go
          - context
          - WithValue
          - chave
          - pedido
        callout:
          type: danger
          label: "Evite:"
          text: passar `*sql.DB`, caches mutáveis ou logger com estado pelo `WithValue`; isso esconde dependências e dificulta testes.
      - title: Ligar contexto a HTTP
        kicker: Request.Context
        description: "Em handlers, use `ctx := r.Context()` para respeitar cancelamento do cliente ou timeouts do servidor. `http.NewRequestWithContext` associa o contexto ao pedido de saída (detalhes em `Go: HTTP` no hub)."
        descriptionTone: default
        code: |-
          package main

          import (
          	"context"
          	"fmt"
          	"net/http"
          )

          func main() {
          	ctx, cancel := context.WithCancel(context.Background())
          	cancel()
          	req, err := http.NewRequestWithContext(ctx, http.MethodGet, "http://example.invalid/", nil)
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(req.Context().Err())
          }
        output: context canceled
        tags:
          - go
          - context
          - http
          - Request
          - cliente
tech: go
order: 24
cardDescription: "Guia prático para context.Context: cancelamento, prazos, WithValue e pedidos HTTP."
