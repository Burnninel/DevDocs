id: php-banco-dados
title: "PHP: Conexão e Manipulação de Banco de Dados"
subtitle: Referência prática para conectar com PDO, consultar dados e executar CRUD com segurança no dia a dia.
searchPlaceholder: Buscar PDO, SELECT, INSERT, SQL Injection ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: php
defaultSectionLayout: single
quickStart:
  title: Como testar os exemplos desta documentação
  kicker: Pré-requisitos e base mínima para o CRUD
  description: Os exemplos usam `PDO` com `pdo_mysql` ativo e uma tabela `usuarios` simples para CRUD.
  steps:
    - Verifique o PHP com `php --version`.
    - Confirme o driver com `php -m`.
    - Crie o banco e a tabela `usuarios`.
    - Ajuste host, banco, usuário e senha no exemplo.
    - Salve um snippet em `db.php` e rode `php db.php`.
  codeLanguage: sql
  code: |-
    CREATE DATABASE devdocs_php_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE devdocs_php_db;

    CREATE TABLE usuarios (
        id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
        nome VARCHAR(120) NOT NULL,
        email VARCHAR(160) NOT NULL UNIQUE,
        status VARCHAR(20) NOT NULL DEFAULT 'ativo',
        pontos INT NOT NULL DEFAULT 0
    );
  callout:
    type: hint
    label: "Dica:"
    text: "use `charset=utf8mb4` no DSN para evitar problema com acentuação e caracteres especiais. A seção **Transações** cobre `beginTransaction`, `commit` e `rollBack`; erros com PDO combinam com `PHP: Erros e exceções` no hub."
sections:
  - id: o-que-e-pdo
    name: O que é PDO
    layout: single
    entries:
      - title: PDO é a forma mais prática de falar com o banco no PHP
        kicker: Conexão padronizada com suporte a prepared statements
        description: "`PDO` é a extensão do PHP usada para conectar no banco e executar SQL com uma API consistente. Vale usar porque facilita conexão, tratamento de erro e consultas seguras com `prepare()`."
        code: |-
          <?php
          $pdo = new PDO(
              "mysql:host=127.0.0.1;dbname=devdocs_php_db;charset=utf8mb4",
              "root",
              ""
          );

          echo $pdo instanceof PDO ? "PDO conectado" . PHP_EOL : "Falha";
        output: PDO conectado
        tags:
          - php
          - pdo
          - conceito
          - conexao
          - base
          - crud
  - id: como-conectar
    name: Como conectar no banco
    layout: single
    entries:
      - title: Conexão simples com DSN, usuário, senha e try/catch
        kicker: Base segura para abrir a conexão
        description: O `DSN` informa driver, host, banco e charset. `usuário` e `senha` autenticam a conexão. Use `try/catch` para tratar erro sem expor detalhes técnicos para o usuário.
        code: |-
          <?php
          $dsn = "mysql:host=127.0.0.1;dbname=devdocs_php_db;charset=utf8mb4";
          $user = "root";
          $password = "";

          try {
              $pdo = new PDO($dsn, $user, $password, [
                  PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES => false,
              ]);

              echo "Conexão criada com sucesso" . PHP_EOL;
          } catch (PDOException $e) {
              error_log($e->getMessage());
              echo "Não foi possível conectar ao banco." . PHP_EOL;
          }
        output: Conexão criada com sucesso
        tags:
          - php
          - pdo
          - dsn
          - try-catch
          - conexao
          - charset
        callout:
          type: hint
          label: "DSN:"
          text: "`host` aponta o servidor, `dbname` define a base, `charset=utf8mb4` evita problema de codificação."
      - title: Boa prática com config.php e DatabaseConnection.php
        kicker: Separar configuração da criação do PDO
        description: Separar credenciais em `config.php` deixa a manutenção mais simples e evita repetir dados sensíveis em vários pontos do sistema.
        code: |-
          <?php
          // config.php
          return [
              "dsn" => "mysql:host=127.0.0.1;dbname=devdocs_php_db;charset=utf8mb4",
              "user" => "root",
              "password" => "",
          ];

          // DatabaseConnection.php
          final class DatabaseConnection
          {
              public static function make(): PDO
              {
                  $config = require __DIR__ . "/config.php";

                  return new PDO($config["dsn"], $config["user"], $config["password"], [
                      PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  ]);
              }
          }
        tags:
          - php
          - config
          - databaseconnection
          - pdo
          - organizacao
          - boas-praticas
  - id: consultar-dados
    name: Como consultar dados
    layout: single
    entries:
      - title: Buscar um único registro com prepare, execute e fetch
        kicker: Ideal para usuário por ID
        description: "Use `prepare(string $sql)` para montar a query, `execute(array $params)` para enviar os valores e `fetch()` quando você espera apenas uma linha. Em `execute`, o array liga cada placeholder (ex: `:id`) ao valor correspondente."
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $stmt = $pdo->prepare("SELECT id, nome, email FROM usuarios WHERE id = :id");
          $stmt->execute([":id" => 7]);

          $usuario = $stmt->fetch();

          if ($usuario) {
              echo $usuario["nome"] . " <" . $usuario["email"] . ">" . PHP_EOL;
          }
        output: Ana Silva <ana@email.com>
        tags:
          - php
          - select
          - prepare
          - execute
          - fetch
          - pdo
      - title: Listar várias linhas com fetchAll
        kicker: Bom para listas pequenas e telas simples
        description: "`fetchAll()` retorna todas as linhas em um array. Funciona bem para listas pequenas. Em tabelas grandes, o ideal é paginar."
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $stmt = $pdo->prepare("SELECT id, nome, status FROM usuarios WHERE status = :status ORDER BY id DESC LIMIT 5");
          $stmt->execute([":status" => "ativo"]);

          $usuarios = $stmt->fetchAll();

          foreach ($usuarios as $usuario) {
              echo $usuario["id"] . " - " . $usuario["nome"] . PHP_EOL;
          }
        output: |-
          9 - Carla Lima
          8 - Bruno Costa
          7 - Ana Silva
        tags:
          - php
          - select
          - fetchall
          - lista
          - pdo
          - consulta
        callout:
          type: warn
          label: "Atenção:"
          text: evite `fetchAll()` em tabelas muito grandes sem paginação.
  - id: criar-registros
    name: Como criar registros
    layout: single
    entries:
      - title: Inserir usuário com INSERT e placeholders
        kicker: Salvar dados sem concatenar valores na query
        description: Use placeholders para separar o SQL dos valores enviados. O `execute(array $params)` recebe um mapa `placeholder => valor`, por exemplo `:nome => "Ana"`. Isso deixa o código mais seguro e mais fácil de manter.
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $sql = "INSERT INTO usuarios (nome, email, status) VALUES (:nome, :email, :status)";
          $stmt = $pdo->prepare($sql);
          $stmt->execute([
              ":nome" => "Ana Silva",
              ":email" => "ana@email.com",
              ":status" => "ativo",
          ]);

          echo "Novo ID: " . $pdo->lastInsertId() . PHP_EOL;
        output: "Novo ID: 10"
        tags:
          - php
          - insert
          - placeholders
          - pdo
          - crud
          - usuarios
  - id: alterar-registros
    name: Como alterar registros
    layout: single
    entries:
      - title: Atualizar dados com UPDATE
        kicker: Mudar campos sem recriar o registro
        description: Use `UPDATE` quando o registro já existe e você precisa alterar nome, email, status ou outro campo.
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $sql = "UPDATE usuarios SET nome = :nome, status = :status WHERE id = :id";
          $stmt = $pdo->prepare($sql);
          $stmt->execute([
              ":id" => 10,
              ":nome" => "Ana Souza",
              ":status" => "inativo",
          ]);

          echo "Linhas afetadas: " . $stmt->rowCount() . PHP_EOL;
        output: "Linhas afetadas: 1"
        tags:
          - php
          - update
          - pdo
          - crud
          - usuarios
          - rowcount
  - id: deletar-registros
    name: Como deletar registros
    layout: single
    entries:
      - title: Remover um registro com DELETE
        kicker: Exclusão direta quando a regra permitir
        description: Use `DELETE` quando a regra realmente permitir exclusão física. Se o sistema precisa de histórico, prefira inativar o registro.
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $stmt = $pdo->prepare("DELETE FROM usuarios WHERE id = :id");
          $stmt->execute([":id" => 10]);

          echo "Linhas removidas: " . $stmt->rowCount() . PHP_EOL;
        output: "Linhas removidas: 1"
        tags:
          - php
          - delete
          - pdo
          - crud
          - usuarios
          - rowcount
  - id: prepared-statements
    name: Prepared Statements e SQL Injection
    layout: single
    entries:
      - title: O que é SQL Injection e por que prepare resolve isso
        kicker: Não concatenar entrada do usuário em SQL
        description: "`SQL Injection` acontece quando valor vindo de fora entra direto na query e altera a lógica do SQL. `prepare()` resolve isso separando a estrutura da consulta dos dados enviados."
        code: |-
          <?php
          $id = $_GET["id"] ?? "1";

          // ERRADO
          $sqlErrado = "SELECT id, nome FROM usuarios WHERE id = " . $id;

          // CERTO
          $pdo = DatabaseConnection::make();
          $stmt = $pdo->prepare("SELECT id, nome FROM usuarios WHERE id = :id");
          $stmt->execute([":id" => (int) $id]);

          print_r($stmt->fetch());
        tags:
          - php
          - prepared-statements
          - sql-injection
          - prepare
          - seguranca
          - pdo
        callout:
          type: danger
          label: "Perigo:"
          text: nunca monte SQL com dado vindo de `GET`, `POST`, JSON ou formulário por concatenação direta.
      - title: "bindValue: quando usar e qual risco evitar"
        kicker: Valor imediato, ideal para a maioria dos CRUDs
        description: "`bindValue(string $param, mixed $value, int $type = PDO::PARAM_STR)` envia o valor no momento do bind. `$param` é o placeholder (ex: `:id`), `$value` é o valor enviado e `$type` define o tipo PDO. É a opção mais previsível para entradas simples de formulário, filtros e CRUD. O risco mais comum é passar tipo errado e ter comparação inesperada no banco."
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $stmt = $pdo->prepare("SELECT id, nome FROM usuarios WHERE id = :id AND status = :status");
          $stmt->bindValue(":id", 7, PDO::PARAM_INT);
          $stmt->bindValue(":status", "ativo", PDO::PARAM_STR);
          $stmt->execute();

          print_r($stmt->fetch());
        tags:
          - php
          - bindvalue
          - param-int
          - param-str
          - pdo
          - prepared-statements
        callout:
          type: hint
          label: "Quando usar:"
          text: prefira `bindValue()` quando o valor já está pronto e não vai mudar antes do `execute()`.
      - title: "bindParam: quando usar e qual risco evitar"
        kicker: Variável por referência, útil para reuso de statement
        description: "`bindParam(string $param, mixed &$var, int $type = PDO::PARAM_STR)` liga o placeholder à variável por referência e só usa o valor final no `execute()`. `$param` é o placeholder, `$var` é a variável ligada por referência e `$type` define o tipo PDO. Funciona bem quando você reaproveita a mesma query em loop mudando a variável. O risco é alterar essa variável sem perceber antes do `execute()` e consultar/salvar dados diferentes do esperado."
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          $status = "ativo";
          $stmt = $pdo->prepare("SELECT id, nome, status FROM usuarios WHERE status = :status LIMIT 2");
          $stmt->bindParam(":status", $status, PDO::PARAM_STR);

          $status = "inativo"; // Valor final que sera usado no execute
          $stmt->execute();

          print_r($stmt->fetchAll());
        tags:
          - php
          - bindparam
          - param-str
          - pdo
          - prepared-statements
          - consulta
        callout:
          type: warn
          label: "Atenção:"
          text: evite reutilizar a mesma variável em fluxos longos sem controle, para não enviar valor errado por referência.
      - title: bindValue x bindParam em leitura rápida
        kicker: Escolha pelo momento em que o valor é resolvido
        description: Os dois ajudam no prepared statement, mas servem melhor para cenários diferentes. A comparação abaixo ajuda a decidir sem precisar reler toda a teoria.
        contentBlocks:
          - type: comparison-block
            title: Comparação direta
            columns:
              - title: bindValue
                description: Resolve o valor no momento do bind.
                items:
                  - Melhor para formulário, filtros e CRUD simples.
                  - Mais previsível quando o valor já está pronto.
                  - Evita surpresa com variável mudando antes do `execute()`.
              - title: bindParam
                description: Liga o placeholder à variável por referência.
                items:
                  - Útil quando a mesma query roda várias vezes mudando a variável.
                  - O valor final só é lido no `execute()`.
                  - Exige mais cuidado em fluxos longos para não enviar dado inesperado.
        tags:
          - php
          - bindvalue
          - bindparam
          - comparacao
          - pdo
          - prepared-statements
  - id: transacoes-pdo
    name: Transações (BEGIN, COMMIT, ROLLBACK)
    layout: single
    entries:
      - title: beginTransaction, commit e rollBack no PDO
        kicker: Várias escritas passam a falhar ou confirmar em conjunto
        description: "Use transação quando duas ou mais operações devem ser atómicas: se uma falhar, nenhuma alteração fica persistida. `beginTransaction()` inicia, `commit()` confirma e `rollBack()` desfaz alterações pendentes na mesma transação. Em `PDO`, `rollBack` também é chamado automaticamente em alguns erros se `ATTR_AUTOCOMMIT` estiver desligado — ainda assim trate exceções e faça `rollBack` explícito no `catch` para fluxo legível."
        descriptionTone: default
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          // $pdo: conexão; $deId/$paraId: contas; $pontos: quantidade transferida
          function transferirPontos(PDO $pdo, int $deId, int $paraId, int $pontos): void
          {
              $pdo->beginTransaction();

              try {
                  $debito = $pdo->prepare("UPDATE usuarios SET pontos = pontos - :pontos WHERE id = :id");
                  $debito->execute([":pontos" => $pontos, ":id" => $deId]);

                  if ($debito->rowCount() === 0) {
                      throw new RuntimeException("Origem inexistente");
                  }

                  $credito = $pdo->prepare("UPDATE usuarios SET pontos = pontos + :pontos WHERE id = :id");
                  $credito->execute([":pontos" => $pontos, ":id" => $paraId]);

                  if ($credito->rowCount() === 0) {
                      throw new RuntimeException("Destino inexistente");
                  }

                  $pdo->commit();
                  echo "Transação concluída com commit." . PHP_EOL;
              } catch (Throwable $e) {
                  if ($pdo->inTransaction()) {
                      $pdo->rollBack();
                  }
                  echo "Rollback: " . $e->getMessage() . PHP_EOL;
              }
          }

          transferirPontos($pdo, 7, 8, 100);
        output: Transação concluída com commit.
        tags:
          - php
          - pdo
          - transacao
          - commit
          - rollback
          - acid
        callout:
          type: hint
          label: "Padrão:"
          text: "`beginTransaction` → vários `execute` → `commit`; em `catch`, `rollBack` se `inTransaction()` for verdadeiro."
      - title: Evitar transação longa e misturar leituras desnecessárias
        kicker: Locks prolongados degradam o sistema
        description: "Mantenha a transação curta: abra só quando for escrever e feche rapidamente. Não deixe I/O externo (HTTP, disco lento) dentro da transação. Para padrões avançados (níveis de isolamento), consulte a documentação do motor (MySQL/InnoDB, etc.)."
        descriptionTone: warn
        code: |-
          <?php
          $pdo = DatabaseConnection::make();

          echo "inTransaction antes: " . ($pdo->inTransaction() ? "sim" : "nao") . PHP_EOL;
          $pdo->beginTransaction();
          echo "inTransaction durante: " . ($pdo->inTransaction() ? "sim" : "nao") . PHP_EOL;
          $pdo->rollBack();
          echo "inTransaction depois: " . ($pdo->inTransaction() ? "sim" : "nao") . PHP_EOL;
        output: |-
          inTransaction antes: nao
          inTransaction durante: sim
          inTransaction depois: nao
        tags:
          - php
          - pdo
          - intransaction
          - lock
          - performance
          - transacao
        callout:
          type: hint
          label: "Cruzamento:"
          text: "erros de SQL dentro de transação combinam com `PHP: Erros e exceções` para não expor detalhes ao cliente da API."
  - id: tratamento-erros
    name: Tratamento de erros
    layout: single
    entries:
      - title: Usar try/catch com mensagem segura
        kicker: Erro técnico no log, resposta simples para o usuário
        description: Em ambiente real, o usuário não precisa ver stack trace nem credencial. O ideal é registrar o erro tecnicamente e responder com uma mensagem curta.
        code: |-
          <?php
          try {
              $pdo = DatabaseConnection::make();
              $stmt = $pdo->prepare("SELECT id, nome FROM usuarios WHERE id = :id");
              $stmt->execute([":id" => 7]);

              print_r($stmt->fetch());
          } catch (Throwable $e) {
              error_log($e->getMessage());
              echo "Erro interno ao consultar dados." . PHP_EOL;
          }
        output: |-
          Array
          (
              [id] => 7
              [nome] => Ana Silva
          )
        tags:
          - php
          - try-catch
          - erros
          - pdo
          - log
          - seguranca
        callout:
          type: hint
          label: "Ambiente:"
          text: detalhe técnico no log faz sentido em desenvolvimento; mensagem simples faz sentido para usuário final.
  - id: boas-praticas
    name: Boas práticas
    layout: single
    entries:
      - title: Checklist curto para acesso ao banco com PDO
        kicker: Decisões simples que evitam problema depois
        description: Separe `config.php`, use `charset=utf8mb4`, valide dados antes do banco, não exponha credenciais e evite SQL direto no controller. `Service` e `Repository` fazem sentido quando o projeto começa a crescer.
        contentBlocks:
          - type: checklist-block
            title: Antes de fechar o acesso ao banco
            items:
              - Separe `config.php` da criação da conexão.
              - Use `charset=utf8mb4` no DSN.
              - Valide dados antes de montar o `execute()`.
              - Não exponha credenciais nem mensagem técnica para o usuário final.
              - Evite SQL direto no controller quando o projeto começar a crescer.
              - Use `fetchAll()` só com volume pequeno ou paginação.
              - Use transação quando várias escritas têm de ser atómicas (`beginTransaction` / `commit` / `rollBack`).
          - type: context-block
            variant: good-practice
            label: "Fechamento:"
            text: "o trio mais importante continua o mesmo: prepared statement sempre, validação antes do SQL e mensagens técnicas apenas em log."
        tags:
          - php
          - boas-praticas
          - validacao
          - config
          - repository
          - service
  - id: constantes-opcoes-pdo
    name: Constantes e opções comuns do PDO
    layout: single
    entries:
      - title: Constantes mais usadas no dia a dia
        kicker: Opções pequenas que mudam o comportamento do PDO
        description: "Essas são algumas das constantes e opções mais usadas com `PDO` no dia a dia. O objetivo aqui é servir como consulta rápida: o nome da constante e o que ela faz."
        contentBlocks:
          - type: tech-list
            items:
              - term: PDO::PARAM_STR
                description: Define que o valor enviado no bind deve ser tratado como string.
              - term: PDO::PARAM_INT
                description: Define que o valor enviado no bind deve ser tratado como inteiro.
              - term: PDO::PARAM_BOOL
                description: Define que o valor enviado no bind deve ser tratado como booleano.
              - term: PDO::FETCH_ASSOC
                description: Faz o fetch retornar array associativo, usando o nome das colunas como chave.
              - term: PDO::FETCH_OBJ
                description: Faz o fetch retornar objeto em vez de array.
              - term: PDO::ATTR_ERRMODE
                description: Define como o PDO reage quando acontece um erro.
              - term: PDO::ERRMODE_EXCEPTION
                description: Faz o PDO lançar exceção em caso de erro. É a opção mais usada em projetos atuais.
              - term: PDO::ATTR_DEFAULT_FETCH_MODE
                description: Define o modo padrão de retorno do fetch, sem precisar repetir isso em toda consulta.
              - term: PDO::ATTR_EMULATE_PREPARES
                description: Controla se o prepare será emulado pelo driver ou executado de forma nativa pelo banco.
              - term: PDO::PARAM_NULL
                description: Define que o valor enviado no bind deve ser tratado como `null`.
        tags:
          - php
          - pdo
          - param-int
          - param-str
          - fetch-assoc
          - errmode
  - id: visao-geral-arquivos
    name: Exemplo simples mais completo
    layout: single
    entries:
      - title: Como config, conexão, model, service e controller se conectam
        kicker: Visão geral curta sem montar um sistema grande
        description: "A ideia aqui é mostrar o papel de cada arquivo: `config.php` guarda configuração, `DatabaseConnection.php` cria o PDO, `UsuarioModel.php` faz o SQL, `UsuarioService.php` valida regra e `UsuarioController.php` recebe a requisição."
        code: |-
          <?php
          // config.php
          return [
              "dsn" => "mysql:host=127.0.0.1;dbname=devdocs_php_db;charset=utf8mb4",
              "user" => "root",
              "password" => "",
          ];

          // DatabaseConnection.php
          final class DatabaseConnection
          {
              public static function make(): PDO
              {
                  $config = require __DIR__ . "/config.php";
                  return new PDO($config["dsn"], $config["user"], $config["password"]);
              }
          }

          // UsuarioModel.php
          final class UsuarioModel
          {
              public function __construct(private PDO $pdo) {}

              public function listar(): array
              {
                  return $this->pdo->query("SELECT id, nome FROM usuarios")->fetchAll(PDO::FETCH_ASSOC);
              }
          }

          // UsuarioService.php
          final class UsuarioService
          {
              public function __construct(private UsuarioModel $model) {}

              public function listarUsuarios(): array
              {
                  return $this->model->listar();
              }
          }

          // UsuarioController.php
          $service = new UsuarioService(new UsuarioModel(DatabaseConnection::make()));
          print_r($service->listarUsuarios());
        tags:
          - php
          - config
          - databaseconnection
          - usuariomodel
          - usuarioservice
          - usuariocontroller
tech: php
order: 11
cardDescription: Guia prático para conectar com PDO, executar CRUD com segurança, evitar SQL Injection e organizar acesso ao banco.
