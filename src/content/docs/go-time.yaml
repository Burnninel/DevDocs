id: go-time
title: "Go: Tempo (time)"
subtitle: Guia prático para time.Time em UTC, formatar com layouts, Duration, Since e nota sobre relógio monotónico.
searchPlaceholder: Buscar RFC3339, UTC, Duration, Parse ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Instante fixo em UTC
  kicker: Evitar surpresas de fuso
  description: "Guarde instantes na base de dados em UTC (`time.RFC3339`). Converta para fuso local só na apresentação. Combine com APIs HTTP em `Go: HTTP` e JSON em `Go: JSON`."
  steps:
    - Módulo com `go mod init`.
    - Cole o exemplo em `main.go` e `go run .`.
  codeLanguage: go
  code: |-
    package main

    import (
    	"fmt"
    	"time"
    )

    func main() {
    	t := time.Date(2026, 5, 9, 12, 0, 0, 0, time.UTC)
    	fmt.Println(t.Format(time.RFC3339))
    }
  output: "2026-05-09T12:00:00Z"
  callout:
    type: hint
    label: "Layouts:"
    text: a referência de formatação em Go é o instante `Mon Jan 2 15:04:05 MST 2006`; use constantes como `time.RFC3339` sempre que possível.
sections:
  - id: parse-duracao
    name: Parse e Duration
    layout: single
    entries:
      - title: time.Parse em UTC explícito
        kicker: Fuso ambíguo sem monotonic
        description: "`time.Parse` usa UTC se a string não trouxer offset. Para strings com fuso, o instante resultante ajusta-se. Valide formatos de entrada de utilizadores."
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	t, err := time.Parse(time.RFC3339, "2026-05-09T12:00:00Z")
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(t.UTC().Hour())
          }
        output: "12"
        tags:
          - go
          - time
          - Parse
          - UTC
          - RFC3339
      - title: Duration e Sleep
        kicker: Multiplicadores de unidade
        description: Literais como `500 * time.Millisecond` ou `parseDuration, err := time.ParseDuration("2h30m")` evitam números mágicos em nanosegundos.
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	d, err := time.ParseDuration("1500ms")
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(d == 1500*time.Millisecond)
          }
        output: "true"
        tags:
          - go
          - Duration
          - ParseDuration
          - Sleep
  - id: since-monotonic
    name: Since, Sub e monotónico
    layout: single
    entries:
      - title: Since e Sub para intervalos
        kicker: Medir duração decorrida
        description: "`time.Since(t)` é açúcar sintático para `time.Now().Sub(t)`. `t.Sub(u)` devolve `Duration` assinada entre dois instantes."
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	start := time.Now()
          	time.Sleep(5 * time.Millisecond)
          	fmt.Println(time.Since(start) >= 5*time.Millisecond)
          }
        output: "true"
        tags:
          - go
          - Since
          - Sub
          - Duration
          - medicao
      - title: Relógio monotónico e comparações
        kicker: Detalhe interno útil
        description: "`time.Time` pode incluir um relógio monotónico para medir intervalos sem saltos quando o relógio de parede é ajustado (NTP). Comparações (`Before`, `After`) usam ambos os relógios de forma segura; não dependas de `UnixNano` para ordenar instantes de wall clock distantes sem ler a documentação oficial."
        descriptionTone: warn
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	a := time.Now()
          	b := a.Add(2 * time.Second)
          	fmt.Println(b.After(a))
          }
        output: "true"
        tags:
          - go
          - time
          - monotonic
          - Before
          - After
tech: go
order: 27
cardDescription: Guia prático para UTC, RFC3339, Parse, Duration, Since e relógio monotónico.
