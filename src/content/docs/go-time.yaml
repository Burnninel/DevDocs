id: go-time
title: "Go: Tempo (time)"
subtitle: Guia prático para time.Time em UTC, formatar com layouts, Duration, Since e nota sobre relógio monotônico.
searchPlaceholder: Buscar RFC3339, UTC, Duration, Parse ou palavra...
shortcutHint: "Atalho: pressione / para focar a busca."
codeLanguage: go
defaultSectionLayout: single
quickStart:
  title: Instante fixo em UTC
  kicker: Evitar surpresas de fuso
  description: "Guarde instantes no banco de dados em UTC (`time.RFC3339`). Converta para fuso local só na apresentação. Combine com APIs HTTP em `Go: HTTP` e JSON em `Go: JSON`."
  steps:
    - Módulo com `go mod init`.
    - Cole o exemplo em `main.go` e `go run .`.
  codeLanguage: go
  code: |-
    package main

    import (
    	"fmt"
    	"time"
    )

    func main() {
    	t := time.Date(2026, 5, 9, 12, 0, 0, 0, time.UTC)
    	fmt.Println(t.Format(time.RFC3339))
    }
  output: "2026-05-09T12:00:00Z"
  callout:
    type: hint
    label: "Layouts:"
    text: a referência de formatação em Go é o instante `Mon Jan 2 15:04:05 MST 2006`; use constantes como `time.RFC3339` sempre que possível.
sections:
  - id: parse-duracao
    name: Parse e Duration
    layout: single
    entries:
      - title: time.Parse em UTC explícito
        kicker: Fuso ambíguo sem monotonic
        description: "`time.Parse` usa UTC se a string não trouxer offset. Para strings com fuso, o instante resultante ajusta-se. Valide formatos de entrada de usuários."
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	t, err := time.Parse(time.RFC3339, "2026-05-09T12:00:00Z")
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(t.UTC().Hour())
          }
        output: "12"
        tags:
          - go
          - time
          - Parse
          - UTC
          - RFC3339
      - title: Duration e Sleep
        kicker: Multiplicadores de unidade
        description: Literais como `500 * time.Millisecond` ou `parseDuration, err := time.ParseDuration("2h30m")` evitam números mágicos em nanosegundos.
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	d, err := time.ParseDuration("1500ms")
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(d == 1500*time.Millisecond)
          }
        output: "true"
        tags:
          - go
          - Duration
          - ParseDuration
          - Sleep
  - id: since-monotonic
    name: Since, Sub e monotônico
    layout: single
    entries:
      - title: Since e Sub para intervalos
        kicker: Medir duração decorrida
        description: "`time.Since(t)` é açúcar sintático para `time.Now().Sub(t)`. `t.Sub(u)` retorna `Duration` assinada entre dois instantes."
        descriptionTone: default
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	start := time.Now()
          	time.Sleep(5 * time.Millisecond)
          	fmt.Println(time.Since(start) >= 5*time.Millisecond)
          }
        output: "true"
        tags:
          - go
          - Since
          - Sub
          - Duration
          - medicao
      - title: Relógio monotônico e comparações
        kicker: Detalhe interno útil
        description: "`time.Now()` inclui uma leitura de relógio monotônico, usada para medir intervalos sem sofrer com ajustes do relógio de parede (NTP). Operações entre dois instantes (`Sub`, `Before`, `After`) usam a leitura monotônica **quando ambos os valores a têm**; se um deles perdeu essa leitura (após `t.Round`, `t.UTC`, serialização, etc.), a comparação recai sobre o relógio de parede. Por isso, para ordenar instantes que passaram por serialização, compare com `Before`/`After` em vez de `UnixNano`."
        descriptionTone: warn
        code: |-
          package main

          import (
          	"fmt"
          	"time"
          )

          func main() {
          	a := time.Now()
          	b := a.Add(2 * time.Second)
          	fmt.Println(b.After(a))
          }
        output: "true"
        tags:
          - go
          - time
          - monotonic
          - Before
          - After
  - id: decisao-rapida
    name: Decisão Rápida
    layout: single
    entries:
      - title: Atalho mental para trabalhar com tempo
        kicker: UTC, Duration e comparação de instantes
        description: Use este resumo para não reintroduzir bug de fuso horário em código novo.
        descriptionTone: default
        contentBlocks:
          - type: reference-card
            title: Mapa de decisão
            items:
              - "Guarde instantes em UTC; converta para fuso local só na apresentação."
              - "`time.RFC3339` como layout padrão para parse e format."
              - "`time.ParseDuration` em vez de número mágico em nanosegundos."
              - "`time.Since(t)` para medir intervalo decorrido a partir de um instante salvo."
              - "Comparação (`Before`/`After`) em vez de subtrair `UnixNano` manualmente."
          - type: context-block
            title: Armadilha comum
            variant: common-error
            label: "Cuidado:"
            text: assumir um offset fixo (`+03:00`) o ano todo. Horário de verão, em fusos que ainda o observam, muda o offset — sempre converta a partir de um instante em UTC salvo, não de um offset copiado uma vez.
        tags:
          - go
          - time
          - decisao
          - boas-praticas
